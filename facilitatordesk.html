<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Facilitator Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* ===== Pivot into Tech: Facilitator Desk v3. Dark control-room look, card based. Single look by choice. ===== */
:root{
  --bg:#070B12; --surface:rgba(20,30,44,.78); --surface2:rgba(30,44,62,.7); --ink:#EAF1F7; --muted:#9DB0C3; --line:rgba(160,190,220,.16);
  --accent:#3CC7BD; --accent-ink:#031C1A; --accent-soft:rgba(60,199,189,.14);
  --group:#8F9DFF; --group-soft:rgba(143,157,255,.16);
  --moment:#FFB35C; --moment-soft:rgba(255,179,92,.14);
  --warn:#F2C14E; --warn-soft:rgba(242,193,78,.13);
  --bad:#FF8A80; --bad-soft:rgba(255,138,128,.14);
  --ok:#6FD68B; --ok-soft:rgba(111,214,139,.14);
  --break:#8797A8;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0;min-height:100vh}
.bg{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(900px 520px at 8% -8%,rgba(60,199,189,.20),transparent 62%),
  radial-gradient(820px 520px at 100% 0,rgba(143,157,255,.18),transparent 62%),
  radial-gradient(760px 480px at 50% 115%,rgba(255,179,92,.09),transparent 62%),var(--bg)}
.bg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(ellipse at 50% 0,#000 0,transparent 72%);mask-image:radial-gradient(ellipse at 50% 0,#000 0,transparent 72%)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.12;margin:0;text-wrap:balance}
p{margin:0 0 .6em}
a{color:var(--accent)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
code,.mono{font-family:var(--f-mono);font-size:.88em}
code{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:5px;padding:.05em .35em}
.wrap{max-width:1280px;margin-inline:auto;padding-inline:20px}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
.sub{color:var(--muted);margin:0}
.ico{display:inline-grid;place-items:center;width:28px;height:28px;flex:0 0 auto}
.ico svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(7,11,18,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:10px}
.logo{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:2px 6px 2px 0;font-family:var(--f-display);font-weight:700;font-size:1.05rem;letter-spacing:-.01em}
.logo i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--group));color:#04121A;font-style:normal;font-weight:800;box-shadow:0 6px 18px -6px var(--accent)}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}
.crumb{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:999px;padding:7px 15px;font-weight:600;font-size:.98rem;min-height:38px;color:var(--ink)}
button.crumb:hover{background:rgba(255,255,255,.1)}
.crumb.cur{background:var(--accent-soft);border-color:rgba(60,199,189,.5);color:var(--accent);display:inline-flex;align-items:center}
.sep{color:var(--muted);font-size:1.2rem}
.grow{flex:1 1 auto}
.pillbtn{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:999px;padding:8px 16px;font-weight:700;font-size:.92rem;min-height:40px}
.pillbtn.panic{background:var(--bad-soft);border-color:rgba(255,138,128,.5);color:var(--bad)}
.pillbtn.back{background:var(--accent-soft);border-color:rgba(60,199,189,.5);color:var(--accent)}
.clockbox{display:flex;align-items:center;gap:10px}
#clockT{font-family:var(--f-mono);font-weight:600;font-size:1.7rem;letter-spacing:.02em;font-variant-numeric:tabular-nums;text-shadow:0 0 22px rgba(60,199,189,.5)}

/* ---------- buttons, cards, common ---------- */
.btn{border:1px solid var(--line);background:rgba(255,255,255,.07);border-radius:12px;padding:9px 15px;font-weight:600;min-height:44px;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:rgba(255,255,255,.12)}
.btn.primary{background:linear-gradient(135deg,var(--accent),#2BA9C4);color:var(--accent-ink);border-color:transparent;box-shadow:0 10px 28px -12px var(--accent)}
.btn.small{min-height:36px;padding:6px 11px;font-size:.88rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;min-width:0;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.card h3{font-size:1.1rem;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.h-row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:end;justify-content:space-between;margin-bottom:14px}
.h-row h2{font-size:1.9rem}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--muted);white-space:nowrap}
.pill.self{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.group{background:var(--group-soft);color:var(--group);border-color:transparent}
.pill.moment{background:var(--moment-soft);color:var(--moment);border-color:transparent}
.pill.now{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.pill.late{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}

/* ---------- home ---------- */
main{padding-block:26px 90px}
.hero{padding:18px 0 22px}
.hero h1{font-size:clamp(2.6rem,7vw,4.8rem);letter-spacing:-.03em;background:linear-gradient(120deg,#fff 20%,var(--accent) 60%,var(--group));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:1.2rem;color:var(--muted);max-width:44rem;margin-top:12px}
.tile{display:flex;flex-direction:column;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:22px;padding:22px;color:var(--ink);position:relative;overflow:hidden;min-height:170px;transition:transform .18s,border-color .18s,box-shadow .18s}
.tile:hover{transform:translateY(-3px);border-color:rgba(60,199,189,.55);box-shadow:0 18px 40px -22px var(--accent)}
.tile .ico{width:52px;height:52px;padding:12px;border-radius:16px;background:linear-gradient(135deg,rgba(60,199,189,.25),rgba(143,157,255,.25));color:var(--accent);border:1px solid var(--line)}
.tile h3{font-size:1.4rem}
.tile p{color:var(--muted);margin:0}
.tile .go{margin-top:auto;font-weight:700;color:var(--accent);font-size:.92rem}
.hero-tile{flex-direction:row;align-items:center;gap:22px;min-height:0;padding:28px;margin-bottom:22px;border-color:rgba(60,199,189,.5);background:linear-gradient(120deg,rgba(60,199,189,.22),rgba(143,157,255,.16) 60%,rgba(20,30,44,.8))}
.hero-tile .ico{width:84px;height:84px;padding:22px;background:linear-gradient(135deg,var(--accent),var(--group));color:#04121A;border:0;box-shadow:0 14px 34px -12px var(--accent)}
.hero-tile h3{font-size:clamp(1.8rem,4vw,2.6rem)}
.hero-tile p{font-size:1.1rem;color:#cfe0ec}
.hero-tile .go{font-size:1.05rem}
.sect{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:26px 0 12px;font-family:var(--f-body);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.path{display:flex;flex-wrap:wrap;gap:10px}
.path span{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:999px;padding:8px 16px}
.path b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:.85rem}
.dl{display:flex;align-items:center;gap:16px;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:16px 18px}
.dl .ico{width:44px;height:44px;padding:10px;border-radius:12px;background:var(--group-soft);color:var(--group)}
.dl div{min-width:0;flex:1}
.dl b{display:block}

/* ---------- two-column layout: rail of cards on the left ---------- */
.pres{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;align-items:start}
.rail{position:sticky;top:78px;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 98px);overflow-y:auto;padding:2px 4px 8px 2px;scrollbar-width:thin}
.railh{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:2px 4px 2px}
.pc{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 12px;position:relative;overflow:hidden;min-height:58px;color:var(--ink)}
.pc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
.pc.group::before{background:var(--group)} .pc.break::before{background:var(--break)}
.pc:hover:not(:disabled){border-color:rgba(255,255,255,.3)}
.pc .pn{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.08);font-family:var(--f-mono);font-weight:700;font-size:.9rem}
.pc .pt{min-width:0}
.pc b{display:block;font-size:.95rem;line-height:1.25;overflow-wrap:anywhere}
.pc small{color:var(--muted);font-size:.78rem;font-family:var(--f-mono)}
.pc.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 14px 34px -16px var(--accent);background:linear-gradient(120deg,rgba(60,199,189,.18),var(--surface))}
.pc.now .pn{background:var(--accent);color:var(--accent-ink)}
.pc.done{opacity:.6} .pc.done .pn{background:var(--ok-soft);color:var(--ok)}
.pc.skip{opacity:.32;cursor:default}
.pc.sub{display:block;padding:12px 14px 12px 18px}
.pc.sub b{font-size:1.02rem;font-family:var(--f-display)}
.pc.sub small{display:block;font-family:var(--f-body);margin-top:2px}
.pc.sub.now::before{background:var(--accent)}

/* ---------- stage (the one thing to do now) ---------- */
.stagewrap{min-width:0;display:flex;flex-direction:column;gap:14px}
#lateBox:empty{display:none}
.cue{padding:11px 16px;border-radius:14px;font-weight:600;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.cue.warn{background:var(--warn-soft);border-color:var(--warn)}
.cue.bad{background:var(--bad-soft);border-color:var(--bad)}
.cue.ok{background:var(--ok-soft);border-color:var(--ok)}
.late{border:2px solid var(--warn);background:var(--warn-soft);border-radius:16px;padding:12px 16px}
.late ul{margin:.4em 0 0;padding-left:1.2em}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:clamp(18px,3.2vw,34px);position:relative;overflow:hidden;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.stage::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--accent),var(--group))}
.stage.k-group::before{background:linear-gradient(90deg,var(--group),#C08CFF)}
.stage.k-break::before{background:var(--break)}
.stagehead{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;align-items:flex-start}
.partname{font-size:1.1rem;color:var(--muted);font-weight:600;font-family:var(--f-body)}
.left{text-align:right}
.left small{display:block;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.left b{font-family:var(--f-mono);font-size:1.7rem;font-variant-numeric:tabular-nums}
.goal{color:var(--muted);margin:8px 0 0;max-width:52rem}
.dots{display:flex;gap:6px;margin:16px 0 8px;flex-wrap:wrap}
.dots button{flex:1 1 0;min-width:22px;height:10px;border:0;border-radius:6px;background:rgba(255,255,255,.12);padding:0}
.dots button.on{background:var(--accent)} .dots button.cur{background:linear-gradient(90deg,var(--accent),var(--group));box-shadow:0 0 14px var(--accent)}
.stepno{font-family:var(--f-mono);font-size:.82rem;color:var(--muted)}
.stepname{font-size:clamp(1.9rem,4.4vw,3rem);letter-spacing:-.02em;margin:6px 0 12px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.blk{border-radius:20px;padding:18px 20px;margin-top:14px}
.blk .lbl{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:3px 10px;border-radius:999px;margin-bottom:10px}
.say{background:linear-gradient(120deg,rgba(60,199,189,.2),rgba(60,199,189,.07));border:1px solid rgba(60,199,189,.4)}
.say .lbl{background:var(--accent);color:var(--accent-ink)}
.say p{font-size:clamp(1.25rem,2.3vw,1.7rem);line-height:1.45;margin:.3em 0;font-weight:500}
.dob{background:rgba(255,255,255,.05);border:1px solid var(--line)}
.dob .lbl{background:rgba(255,255,255,.14);color:var(--ink)}
ol.dolist{list-style:none;margin:0;padding:0;counter-reset:d;display:flex;flex-direction:column;gap:10px}
ol.dolist li{counter-increment:d;display:grid;grid-template-columns:30px 1fr;gap:12px;font-size:1.12rem;line-height:1.45}
ol.dolist li::before{content:counter(d);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.12);font-family:var(--f-mono);font-weight:700;font-size:.85rem;margin-top:1px}
.watchb{background:var(--warn-soft);border:1px solid rgba(242,193,78,.5)}
.watchb .lbl{background:var(--warn);color:#2a1d00}
.watchb ul{margin:0;padding-left:1.2em;font-size:1.05rem} .watchb li{margin:.3em 0}
.moment-box{border:2px solid var(--moment);background:var(--moment-soft);border-radius:18px;padding:14px 18px;margin-top:14px;font-size:1.15rem}
.moment-box b{color:var(--moment)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.actbar{position:sticky;bottom:0;z-index:20;display:flex;gap:12px;align-items:stretch;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,transparent,rgba(7,11,18,.92) 30%)}
.actbar .back{flex:0 0 auto;border:1px solid var(--line);background:rgba(255,255,255,.07);border-radius:18px;padding:0 22px;font-weight:700;font-size:1.05rem;min-height:72px}
.actbar .next{flex:1 1 auto;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;border:0;border-radius:18px;padding:10px 26px;min-height:72px;background:linear-gradient(135deg,var(--accent),#2BA9C4 55%,var(--group));color:var(--accent-ink);box-shadow:0 18px 40px -16px var(--accent);text-align:left}
.actbar .next b{font-family:var(--f-display);font-size:1.6rem;letter-spacing:.01em;line-height:1}
.actbar .next small{font-weight:600;font-size:.92rem;opacity:.85}
.actbar .next:hover{filter:brightness(1.07)}
.hint{color:var(--muted);font-size:.82rem;text-align:center;margin:0}

/* ---------- setup ---------- */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;margin:14px 0}
.modecard{text-align:left;border:2px solid var(--line);background:rgba(255,255,255,.04);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:4px;position:relative}
.modecard b{font-family:var(--f-display);font-size:1.3rem}
.modecard .mins{font-family:var(--f-mono);font-size:2rem;font-weight:600;color:var(--accent)}
.modecard span{color:var(--muted);font-size:.93rem}
.modecard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent),0 16px 36px -18px var(--accent)}
.modecard .rec{position:absolute;top:12px;right:12px}
.setrow{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;margin:8px 0 14px}
.setrow label{display:flex;gap:10px;align-items:center;font-weight:600}
.setrow input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.setrow input[type=time]{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:42px;color-scheme:dark}
.summary{border:1px dashed rgba(60,199,189,.5);background:var(--accent-soft);border-radius:14px;padding:12px 16px;font-weight:600}

/* ---------- area content ---------- */
.content{min-width:0}
.content>div>.h-row:first-child{margin-top:0}
.solo{border:0!important;background:transparent!important}
.solo>summary{display:none!important}
.solo .in{padding:0!important}
.ansall>details.accbox{display:none}
.ansall>details.accbox.solo{display:block}
.note{border-left:4px solid var(--moment);background:var(--moment-soft);padding:10px 14px;border-radius:0 14px 14px 0;margin:12px 0}
.note.ok{border-color:var(--ok);background:var(--ok-soft)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}

/* ---------- legacy content styles used by the reference pages ---------- */
ul.tight,ol.tight{margin:0;padding-left:1.2em} ul.tight li,ol.tight li{margin:.2em 0}
.watch li::marker{color:var(--warn)}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:rgba(255,255,255,.05)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin:8px 0 14px}
.tw table{min-width:520px}
.num{font-variant-numeric:tabular-nums}
.key{font-weight:700;color:var(--ok)}
.accbox{border:1px solid var(--line);border-radius:18px;background:var(--surface);margin-bottom:10px}
.accbox>summary{list-style:none;cursor:pointer;padding:14px 16px;font-family:var(--f-display);font-weight:700;font-size:1.1rem;display:flex;gap:10px;align-items:center;min-height:52px}
.accbox>summary::-webkit-details-marker{display:none}
.accbox>summary::after{content:"+";margin-left:auto;font-family:var(--f-mono);font-size:1.3rem;color:var(--muted)}
.accbox[open]>summary::after{content:"\2212"}
.accbox .in{padding:0 16px 16px}
.tool{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.tool h4{font-size:1rem;margin-bottom:8px}
.fields{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:end}
.fields label{display:flex;flex-direction:column;font-size:.78rem;color:var(--muted);font-weight:600;gap:3px}
.fields input,.fields select,.field{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px;width:6.5em;color-scheme:dark}
.fields select{width:auto;max-width:100%}
.out{margin-top:10px;font-family:var(--f-mono);font-size:.9rem;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-wrap:anywhere}
.search{width:100%;background:rgba(255,255,255,.07);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:1.05rem;min-height:48px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chips button{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.85rem;min-height:36px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.qa{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.qa summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none;display:flex;gap:10px;min-height:48px;align-items:center}
.qa summary::-webkit-details-marker{display:none}
.qa summary::before{content:"Q";font-family:var(--f-mono);color:var(--accent);font-weight:700}
.qa .a{padding:0 14px 14px 34px}
.qa .tag{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-left:auto;padding-left:8px}
.fix{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.fix h4{font-size:1rem;margin-bottom:4px}
.fix dl{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px}
.fix dt{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-top:2px}
.fix dd{margin:0}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:8px 6px;border-bottom:1px solid var(--line);min-height:44px}
.checks input{width:22px;height:22px;margin-top:1px;accent-color:var(--accent);flex:0 0 auto}
.checks label.on span{text-decoration:line-through;color:var(--muted)}
.prog{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0 10px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--group));width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:50;max-width:calc(100% - 32px)}
.pre{white-space:pre-wrap;font-family:var(--f-body);font-size:.92rem;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 10px;overflow-wrap:anywhere}
.start{border:2px solid var(--accent);background:var(--accent-soft);border-radius:18px;padding:14px 16px;margin-bottom:14px}
a.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}

/* ---------- phones and small screens ---------- */
@media (max-width:900px){
  .pres{grid-template-columns:1fr;gap:14px}
  .rail{position:static;flex-direction:row;overflow-x:auto;overflow-y:hidden;max-height:none;padding-bottom:8px;-webkit-overflow-scrolling:touch}
  .rail .railh{display:none}
  .pc{flex:0 0 190px}
  .pc.sub{flex:0 0 200px}
  .hero-tile{flex-direction:column;align-items:flex-start}
}
@media (max-width:560px){
  .wrap{padding-inline:16px}
  .crumb{padding:6px 11px;font-size:.9rem}
  #clockT{font-size:1.35rem}
  .actbar .back{padding:0 14px;min-height:64px}
  .actbar .next{min-height:64px;padding:8px 16px} .actbar .next b{font-size:1.3rem} .actbar .next small{font-size:.8rem}
  .left{text-align:left}
  .fix dl{grid-template-columns:1fr}
  .logo span{display:none}
}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile:hover{transform:none}}

<script>
"use strict";
const MODES=["Full","Core","Express"];
const TOTALS=[97,82,67];
const SEGS=[
{id:"welcome",name:"Welcome and ground rules",kind:"group",dur:[4,3,2],goal:"Set the tone: it is fun, it is safe, it is a taster. Name the three rules and the four parts of today.",
 steps:[
 {n:"Hook and promise",d:[1,1,1],say:["Welcome to Pivot into Tech. In the next {TOTAL} minutes you will break a rollercoaster, crack a vault and build a small app.","Nobody here needs any coding experience. Nobody will be tested. You keep everything you make."],
  do:["Stand still. Speak slowly. Look at the whole room.","MindForge has been the afternoon starter. Thank people for playing and tell them it stays open on their laptop for later.","If remote: confirm the room can hear and see you. Ask a helper to give you a thumbs up."]},
 {n:"Ground rules",d:[2,1,1],say:["Three rules. One: it is fine to stop early. Two: it is fine to ask a helper, and helpers will point, not click for you. Three: if you are lost for a minute, that is normal. Being lost and then finding the way is what coding feels like for everyone.","Today is a taster. It does not promise a job. It shows you what the work feels like, so you can decide if you want more."],
  do:["Point to the helpers and ask them to wave.","Say once, clearly, where the toilets and exits are."],
  watch:["Career anxiety in the room (near retirement, redundancy worries). Keep the tone honest and warm. Do not promise outcomes."]},
 {n:"Map of the session",d:[1,1,0],say:["First: LoomSTEM, where we build with blocks together. Second: the Vault, a heist where you learn to code your way out. Last: you build your own small app. MindForge stays open on your laptop all afternoon, so play it whenever you like."],
  do:["Optional: show the agenda slide. Skip it in Express."]}
 ]},
{id:"loom",name:"LoomSTEM, group-run",kind:"group",dur:[25,22,15],slack:2,goal:"Everyone drags blocks together. They see physics react to what they build. Then the reveal: the language they just used is our own.",
 steps:[
 {n:"Open and orient",d:[1,1,1],say:["Open 02 LoomSTEM. Choose Rollercoaster. You will drag blocks into the grey box. When I say run, press Run."],
  do:["Helpers check every screen shows the Rollercoaster and not the hub.","Show how to drag: click, hold, move, let go. Say it out loud."],
  watch:["Trackpad users: dragging is the hardest part. Tell them to click and hold with one finger while moving with another, or use a mouse."]},
 {n:"Rollercoaster, steps 1 to 5",d:[6,5,5],ans:"ans-coaster",
  say:["Step 1: set gravity to 9.8. That is the real value on Earth.","Step 2: place the top of the ride, 80 metres.","Step 3: a small dip to 75 metres. Now press Run. What do you think the rating will be? (Wait for guesses.) It is low. Too tame.","Step 4: a big drop to 10 metres. Step 5: level out at 45 metres. Run it again."],
  do:["Group pace: say each step, wait until most people have dropped the block, then move on.","Expected: step 3 gives 66 out of 100 (bit tame). Step 5 gives 87 out of 100 (thrilling and safe).","Ask: what changed between the two rides? Let two people answer."],
  watch:["A person who drops the block in the wrong place: it snaps back. Tell them to drop inside the grey box.","Speed and thrill numbers appear in the readout. You do not need to explain the formula yet."]},
 {n:"Sandbox: thrilling but safe",d:[3,3,2],ans:"ans-coaster",
  say:["You now have a sandbox. Change any number. Your goal: the highest ride rating you can get. Watch out: too wild makes the rider sick. Too tame is boring. Real ride designers aim for the middle."],
  do:["Give it 2 minutes. Ask who got over 90. Ask what they changed.","Tip for helpers: a total thrill between 23 and 44 scores 90 or more."],
  watch:["A stalled cart (sad face): the cart ran out of speed and cannot climb that high. That is real energy: you cannot climb higher than your speed allows."]},
 {n:"Rollercoasters Part 2: loops",d:[6,5,0],ans:"ans-loops",
  say:["Now the same ride, but we teach the computer to repeat. A variable is a labelled box holding a number. A loop says: do this again, five times. Look, five points from two lines of code."],
  do:["Read the recap, then steps 1 to 6: gravity, height = 90, repeat 5 times, trackPoint(height), height = height - 15, end of loop.","Press Run. Expected: five points at 90, 75, 60, 45, 30 metres, rating 99.","Spreadsheet link for Lucy and Viktor: it is like dragging a formula down a column."],
  watch:["Steps 2 to 5 are all one tiny block. If people fall behind, the helper drags for them, then asks the person to press Run."]},
 {n:"Loop playground",d:[3,2,0],ans:"ans-loops",
  say:["Change the number of points, the drop each time, and the climb at the end. If the climb is as big as the whole drop, the cart cannot get there. Try to make it stall on purpose."],
  do:["Rule: the cart stalls when the final climb is equal to or larger than the total drop (iterations times step)."],
  watch:[]},
 {n:"The reveal: our own language",d:[4,4,4],ans:"ans-reveal",
  say:["Hands off the mouse for a moment. Click the tab that says Real Code.","Everything you dragged is a line of text. Read the first line: @engine colon physics. This is not Scratch. It is not Python. This is a programming language we built ourselves. It is called LoomScript. It has its own parser and its own rules. Nobody else in the world has it. And you just used it.","Now watch. In the engine box, choose chemistry and press Run. (Let them see the red message.) The language refuses to run a physics command in a chemistry program. That is a real rule, enforced by a real language. You did not know you were writing code twenty minutes ago."],
  do:["Say it slowly. After the line 'you just used it', stay silent for five seconds.","Then invite three people to tell the room what the error says in their own words.","Link to careers: banks build small languages like this for trading rules and risk checks. People who understand how languages work are hired for that."],
  moment:"Land the reveal, then pause. Let the room react before you say anything else.",
  watch:["Some people will think it is a gimmick. Show the Real Code tab and the error again. It is a real interpreter.","Yuki and Chidinma may need the sentence repeated in simpler words: 'We made this language. You used it.'"]},
 {n:"Wrap and breathe",d:[2,2,3],say:["Well done. You just used variables, loops and events. Those three ideas are in every programming language. Stand up, stretch, get water in a minute."],
  do:["Optional, and nothing you need to cover: early finishers can try Build an Adventure (10 steps) or the chemistry mix. Answers are on the Answers card.","Helpers open 03 Vault on every laptop during the breather."]}
 ]},
{id:"br1",name:"Breather",kind:"break",dur:[3,2,0],goal:"Let people breathe. Do not skip it in Full or Core.",
 steps:[{n:"Stand, drink, one question",d:[3,2,0],say:["Stand up. Stretch. Get some water. One question from anyone before we start the heist?"],do:["Helpers switch every laptop to 03 Vault and make sure the sound is on low.","Check the projector or the remote screen share is showing the Vault start screen."],watch:["If someone is confused about LoomSTEM, a helper sits with them now, not during the Vault."]}]},
{id:"vault",name:"The Vault, group-run",kind:"group",dur:[35,32,28],slack:3,goal:"A story-led escape room that teaches five programming ideas. It ends with the red button and the real worry about quantum.",
 steps:[
 {n:"Briefing: choose your night",d:[2,2,1],say:["Everyone press The Heist. Not the red button. Not yet.","You wake up in a vault basement. You must crack a cipher, open three doors and find a ledger that proves fraud. You have six minutes on the clock.","Important: the clock does not tick by itself. It only moves when you guess wrong. If it ever runs out, someone rescues you. You cannot lose."],
  do:["Ask a helper to check every person is on The Heist.","Point at the Vale drawer (the tab on the right). It is the safe hint.","Read the reassurance line before pressing Start, not after."],
  watch:["Jack: takes the countdown literally. Say the clock line twice.","Jamie, Frank, Colin: point out that hints are free."],ans:"ans-vault"},
 {n:"Act 1a: the variable",d:[4,4,3],ans:"ans-vault",
  say:["The word on screen is scrambled: CHBSA. We need to decode it. Give the box a name, then put a number in it.","A variable is a box with a name. The computer does not care about the name. The name is for the next human. Pick a good one.","Now try numbers. Wrong guesses cost nothing here. Guess, look, guess again."],
  do:["Names: shift or shift_amount are best. x and thing are accepted with a small nudge.","The number that works: 7. It decodes to VAULT.","Then the flashback screen: predict first. price = 4, then price = price + 2. Answer: 6. Modify: price + 10 gives 14."],
  watch:["People who type a random name. Say: 'All four are accepted. Which one will you understand in three weeks?'"]},
 {n:"Act 1b: the until loop",d:[5,4,4],ans:"ans-vault",
  say:["Second door. Another scrambled word, no tip-off. You could try every shift by hand. Or teach the computer to keep trying until it works. That is an until loop.","Fill two gaps: when to stop, and how much to change each time."],
  do:["Right answers: stop when it_is_a_word; change by 1. It finds the word LEDGER at shift 14. Message: 14 tries.","Wrong on purpose: 'never' or step 0 runs forever (costs 10 seconds). 'shift == 25' runs out without success. Step 5 misses 14 and steps straight past it.","Flashback: counted loop runs 3 times always. Until loop runs however many it takes."],
  watch:["Nobody is punished for running forever. It shows what a bad loop looks like."]},
 {n:"Room One: search by hand",d:[2,2,2],ans:"ans-vault",
  say:["Four boxes, one key. Open them one at a time. This is a linear search. Notice how it feels. Slow and dull. Remember this feeling."],
  do:["Anyone can open the boxes in any order. Each open costs 4 seconds on the clock. The key is in a random box.","Vale says: this is what Room Two is going to test."]},
 {n:"Rooms 2 and 3: the counted loop",d:[4,4,3],ans:"ans-vault",
  say:["Write it once and say how many times. The next wall has 16 boxes. Each cycle checks 4 boxes at once. How many cycles? Work it out.","Room Three has 64 boxes and each cycle checks 8. Work it out yourself."],
  do:["Room Two: 4 cycles (16 divided by 4). Too few stops short and costs 20 seconds. 6 works but is wasteful.","Room Three: 8 cycles (64 divided by 8). 4 or 6 stops short. 12 works but is wasteful.","Flashback: repeat 3 times runs 3 times. Six checks needed: change the 3 to a 6."],
  watch:["Lucy and Ingrid will do this in their head. Ask them to explain how to the table."]},
 {n:"The Ledger: the conditional",d:[4,4,4],ans:"ans-vault",
  say:["Sixty-four accounts. One is the crime. Write a rule: flag any account where the amount is more than 10,000 and the country is not the UK.","Careful: one equals sign puts a value in. Two, or an exclamation and an equals, ask a question. And words need quote marks."],
  do:["Fill four gaps: greater than (>), 10000, not equal (!=), and the text \"UK\" with quote marks.","Then press Run. It scans and stops when it finds the flagged account.","Spreadsheet link: the same rule as IF(AND(amount>10000, country<>\"UK\")).","Flashback: temperature 25 with the rule temperature > 30: does the window open? No. Temperature 35: yes."],
  watch:["The mistakes are the lesson: = instead of !=, UK without quotes. Read the red message aloud."]},
 {n:"The routing code",d:[3,2,3],ans:"ans-vault",
  say:["Last lock: a routing code, 91. It is the product of two numbers. Try dividing by 2, then 3, then 4. Stop when nothing is left over."],
  do:["Click the step button six times: divide by 2 (1 left), 3 (1), 4 (3), 5 (1), 6 (1), 7 (0). 91 = 7 times 13.","Remember this. Finding the two numbers took six tries. For a huge number, it takes longer than the universe. That is what the button will show."],
  watch:["In Core, do this quickly and keep moving. In Express, keep it."]},
 {n:"Out: five ideas and the certificate",d:[3,3,2],ans:"ans-vault",
  say:["You are out. You wrote five programming constructs tonight: a variable, an until loop, a counted loop, a conditional, and a search. Take the short quiz. Then fill in your certificate."],
  do:["Quiz has five questions. Answers are on the Answers card.","Certificate: they can screenshot it. The number on screen is how many boxes they checked by hand."],
  watch:["In Express skip the quiz: go straight to the certificate."]},
 {n:"The button: ritual and press",d:[2,2,1],moment:true,ans:"ans-button",
  say:["You solved four problems by hand. Now I want you to do the one thing the screen tells you not to do.","Press the home icon at the top, confirm (or refresh the page), and find the red button. It says do not press. Everyone find it? Hands over it. Three, two, one, press.","(A message asks: press the quantum button? Everyone says yes together.)"],
  do:["Do the countdown out loud.","There is a short burst of screen static. Warn once: 'There is a flash of static. Look away if flashing bothers you.'","The hum needs a prior click to play. It will work because they have already clicked on the page.","After the static: a call from Vale."],
  moment:"This is the mic drop. Build it up, do the countdown, and let the static do the work.",
  watch:["Speakers off on shared floors: the visual still works.","If the button does not respond, use the Fixes page (Help card)."]},
 {n:"Four scenarios: same jobs, quantum",d:[4,3,3],ans:"ans-button",
  say:["Vale shows you the same four jobs, the way a quantum computer would do them. For each one: read the classical code, press Convert to quantum, then Run the quantum code, then Next.","Everything Vale shows is real. Shor's algorithm and Grover's algorithm, written in plain English."],
  do:["Scenario 1, outer door: Shor's. 26 shifts by hand, one pass with quantum.","Scenario 2, Room One: Grover's. 4 boxes, one tuned step, odds 100%.","Scenario 3, Rooms 2 and 3: 64 boxes need just 6 steps. 16 boxes need 3.","Scenario 4, Ledger: the same if-rule handed to a quantum machine as the oracle. 6 steps.","Keep each scenario to about a minute. Do not lecture."],
  watch:["Overwhelm with words like mod, period, oracle. The screens have plain-English glossaries. Say: 'It is a taster, not a lecture.'"]},
 {n:"Summary and 'harvest now, decrypt later'",d:[2,2,2],ans:"ans-button",
  say:["That is the taste. None of this ran on a real quantum computer tonight. The maths is real. A machine big enough is not built yet.","But here is the worry. Data protected today can be copied today. Someone can store it and wait. When a big enough quantum computer exists, they can open it. That is called harvest now, decrypt later.","That is why banks and governments are already moving to post-quantum encryption, years before the machines exist. In August 2024 the US standards body NIST published its first post-quantum encryption standards. And that is why people who understand both banking and technology are needed."],
  do:["Ask the room: what data at a bank has to stay secret for 20 years? Take two answers.","Reassure: your money is not at risk today.","Then press Back to reality."],
  watch:["Kwame, Tommy and Esther: they may feel alarm. Pair the worry with the answer above.","Do not speak for the bank's own plans. Say: 'The security team owns that. I can point you to them.'"]}
 ]},
{id:"br2",name:"Breather and switch",kind:"break",dur:[2,2,0],goal:"Reset. The next part is different: they drive.",
 steps:[{n:"Stand, then change gear",d:[2,2,0],say:["Take a breath. The last part is different. So far I have led. Now you drive. You will build a small app, and I will show you the first step."],do:["Helpers open Scratch on every laptop and switch to the Compound Click page.","Check Scratch loads with no sign-in. Nobody needs an account."],watch:["If Scratch is blocked on the network, use the Fixes page (Help card) now."]}]},
{id:"ccb",name:"Compound Click: brief and demo",kind:"group",dur:[8,5,4],goal:"Show the pattern: trigger, logic, feedback. Practise it on a tiny example. Then let people go.",
 steps:[
 {n:"The pattern",d:[1,1,1],say:["Every app you use has three parts. A trigger: something happens, like a tap. Logic: the app decides. Feedback: it shows you something. Today you build all three."]},
 {n:"Watch, then predict",d:[4,2,1],ans:"ans-cc",
  say:["Look at the two blocks on the screen. When this sprite is clicked, say hello for 2 seconds. Before I click the cat, what will happen? (Wait.)","I click. Did it match your guess? The top block listens. The bottom block acts."],
  do:["Build the two blocks live: Events, when this sprite clicked. Looks, say Hello for 2 seconds. Snap them.","Explain the four moves: Predict, Run, Investigate, Modify."],
  watch:["The 'say for 2 seconds' block is one of several similar say blocks. Point to the exact one."]},
 {n:"Their turn",d:[3,2,2],say:["Now you. Open Scratch. The cat is already there. Build those two blocks. Click the cat. Then change one thing, the message or the seconds, and test again."],
  do:["Helpers walk the room. Look for blocks that are close together but not snapped.","Then say: Right-click the cat and delete it. We start fresh."]}
 ]},
{id:"ccs",name:"Compound Click: self-paced build",kind:"self",dur:[15,12,10],goal:"Everyone works at their own speed. Helpers circulate. Anything that reacts to a click is a win.",
 steps:[
 {n:"Steps 1 to 3: stage, memory, reset",d:[6,5,4],ans:"ans-cc",
  say:["Step 1: delete the cat, add the Crystal sprite, choose a backdrop. Step 2: make a variable called Savings and tick the box so it shows. Step 3: when the green flag is clicked, set Savings to 0. Add a second script: when the R key is pressed, set Savings to 0.","You do not need to finish. Even one click that changes a number is real software."],
  do:["Call the checkpoint at +5 minutes: 'By now most people should have a Savings variable on screen.'","Helpers watch for: gaps between blocks, variable checkbox not ticked, R key dropdown still on space."]},
 {n:"Step 4: make it respond",d:[6,5,5],ans:"ans-cc",
  say:["Step 4 is the fiddly one. Everyone slows here. When the crystal is clicked: change Savings by 10, play a sound, change colour effect by 25, wait 0.1 seconds, change colour effect by minus 25. Start with just the first block if you like."],
  do:["Call the checkpoint at +10 minutes: 'If you are stuck, build the smaller version. Click the crystal, watch the number go up.'","Fast finishers: Step 5 (personalise) and Step 6 (say something when Savings passes 100)."],
  watch:["Sound missing: check the Sounds tab. Colour flash invisible: the wait block is missing."]},
 {n:"Steps 5 and 6, extensions",d:[3,2,1],ans:"ans-cc",
  say:["Make it yours: change the backdrop, the costume or the number. If you are done, try Step 6 or an extension."],
  do:["Extensions: random returns, compound interest with a forever loop, expenses, broadcast milestone.","Tell people to prepare one thing to show the room."]}
 ]},
{id:"close",name:"Showcase, next steps, close",kind:"group",dur:[5,4,8],goal:"Celebrate. Connect what they did to real roles. Give them a next step. Finish on time.",
 steps:[
 {n:"Showcase",d:[2,2,3],say:["Stop clicking for a moment. Who will show us one thing they built? It can be tiny."],
  do:["Take two or three volunteers. Applaud each. Celebrate the smallest ones the loudest.","If remote: helpers hold the camera or share the volunteer's screen."],watch:["Do not force anyone. Frank and Colin will not volunteer. A thumbs-up from the helper is enough."]},
 {n:"What you actually did",d:[1,1,2],say:["In this session you used a variable, a loop, a conditional and an event. You wrote in a language we built. You solved a heist. You built an app. That is what a junior developer does. It is also what analysts, testers and security people do every day. None of this needed a degree today."],
  do:["Optional: show the skills slide.","Repeat the taster line: this does not promise a job. It shows the work."]},
 {n:"Next steps and close",d:[2,1,3],say:["If you liked it, here is what to do next. (Point to the follow-up link.) Take the certificate. Try Compound Click again at home. Talk to a helper. Thank you."],
  do:["Give the follow-up link and contact from the Checklists page (Prepare card).","Express: this is where you say they can finish Compound Click at home from the same link.","Ask for feedback by a show of hands: energy, pace, clarity."]}
 ]}
];

const CUTS=[
 {seg:"vault",label:"Skip the Vault quiz, go straight to the certificate",mins:[1,1,0]},
 {seg:"loom",label:"Skip Rollercoaster Part 2 (loops)",mins:[9,7,0]},
 {seg:"vault",label:"Skip the routing code",mins:[3,2,3]},
 {seg:"ccs",label:"Tell people to stop after Step 4",mins:[4,3,2]},
 {seg:"close",label:"One volunteer only in the showcase",mins:[1,1,1]},
 {seg:"br1",label:"Shorten the first breather to one minute",mins:[2,1,0]}
];
const EXTRAS=["LoomSTEM: Build an Adventure (10 steps). Optional. Never needed, no need to mention it.","LoomSTEM: the chemistry mix (pH). Optional. Not part of the session.","Quantum Playground, seven mini-labs. Optional, only for keen people who finish early.","Compound Click extensions: random returns, compound interest, expenses, milestone broadcast."];
function store(k,v){try{localStorage.setItem("ptt_"+k,JSON.stringify(v))}catch(e){}}
function load(k,d){try{const v=localStorage.getItem("ptt_"+k);return v===null?d:JSON.parse(v)}catch(e){return d}}
function segDur(s){return s.dur[S.mode]+(S.remote&&s.slack?s.slack:0)}
function plan(){let t=0;return SEGS.map(s=>{const d=segDur(s);const o={s,start:t,end:t+d,dur:d};t+=d;return o})}
function total(){return plan().reduce((a,p)=>a+p.dur,0)}
const hm=m=>{m=Math.max(0,Math.round(m));return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
const hms=sec=>{sec=Math.max(0,Math.floor(sec));return String(Math.floor(sec/3600)).padStart(2,"0")+":"+String(Math.floor(sec%3600/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")};
const ms=sec=>{const neg=sec<0;sec=Math.abs(Math.round(sec));return (neg?"-":"")+String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")};
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
function stepRows(seg,segStartMin){
  let t=segStartMin;const rows=[];
  seg.steps.forEach(st=>{const d=st.d[S.mode];rows.push({st,d,start:t,end:t+d});t+=d});
  if(S.remote&&seg.slack){rows.push({st:{n:"Remote buffer for lag and screen-share delay",d:[seg.slack,seg.slack,seg.slack],say:[],do:["Use this only if the link is slow. If not needed, move on early and gain the time."],watch:[]},d:seg.slack,start:t,end:t+seg.slack,buffer:true})}
  return rows;
}
function coaster(g,pts){
  let ph=null,pv=0,th=0;const log=[];
  for(const h of pts){
    if(ph===null){ph=h;continue}
    const vs=pv*pv+2*g*(ph-h);
    if(vs<=0)return {stalled:true,at:h,th,log};
    const v=Math.sqrt(vs);th+=Math.abs(v-pv);log.push({h,v});pv=v;ph=h;
  }
  return {stalled:false,th,log,rating:rate(th)};
}
function rate(t){const a=12,b=55;if(t>=a&&t<=b)return Math.round(100-20*Math.abs(t-(a+b)/2)/((b-a)/2));if(t<a)return Math.round(80*t/a);return Math.max(0,Math.round(80-(t-b)*3))}
function face(t){return t>55?"sick face (too intense)":t>30?"amazed face":t>12?"happy face":"neutral face (tame)"}
const PH={"lemon juice":2,"vinegar":2.5,"black coffee":5,"milk":6.5,"baking soda":9,"soap":10,"ammonia":11.5,"bleach":13};
function mixPH(a,b){const h1=10**-a,o1=10**(a-14),h2=10**-b,o2=10**(b-14);const n=((h1-o1)+(h2-o2))/2;return n>0?-Math.log10(n):n<0?14+Math.log10(-n):7}
function verdict(p){return p<3?"strongly acidic":p<6.5?"weakly acidic":p<=7.5?"neutral":p<=11?"weakly alkaline":"strongly alkaline"}
function groverK(N){const th=Math.asin(1/Math.sqrt(N));return Math.max(1,Math.round(Math.PI/4/th-.5))}
function groverP(N,k){const th=Math.asin(1/Math.sqrt(N));return Math.sin((2*k+1)*th)**2}
function shift(w,n){return [...w].map(c=>String.fromCharCode((c.charCodeAt(0)-65+n+26)%26+65)).join("")}

function bindAnswers(root){
  const g=id=>root.querySelector("#"+id);
  const calc=()=>{
    const r=coaster(+g("cg").value||9.8,[+g("c1").value,+g("c2").value,+g("c3").value,+g("c4").value]);
    g("cout").innerHTML=r.stalled?`Stalled at ${r.at} m. The cart ran out of speed. Ride incomplete.`:`Speeds: ${r.log.map(x=>x.v.toFixed(1)).join(", ")} m/s. Thrill ${r.th.toFixed(1)}. Rating <b>${r.rating} / 100</b>. Face: ${face(r.th)}.`;
  };
  ["cg","c1","c2","c3","c4"].forEach(i=>g(i).addEventListener("input",calc));calc();
  const lc=()=>{
    const n=+g("li").value,st=+g("ls").value,cl=+g("lc").value;const pts=[];let h=90;
    for(let i=0;i<n;i++){pts.push(h);h-=st}
    pts.push(h+cl);
    const r=coaster(9.8,pts);
    g("lout").innerHTML=`Points: ${pts.join(", ")}. `+(r.stalled?`Stalled at ${r.at} m (climb ${cl} is not less than total drop ${n*st}).`:`Thrill ${r.th.toFixed(1)}. Rating <b>${r.rating} / 100</b>.`);
  };
  ["li","ls","lc"].forEach(i=>g(i).addEventListener("input",lc));lc();
  const pc=()=>{const a=PH[g("pa").value],b=PH[g("pb").value];const p=mixPH(a,b);g("pout").innerHTML=`pH <b>${p.toFixed(2)}</b>, ${verdict(p)}. (Simple average would be ${((a+b)/2).toFixed(2)}.)`};
  g("pa").addEventListener("change",pc);g("pb").addEventListener("change",pc);pc();
  const rc=()=>{const n=+g("rn").value,b=+g("rb").value;g("rout").innerHTML=b>0?`Exact cycles: <b>${Math.ceil(n/b)}</b> (${n} / ${b}).`:"Enter a size above zero."};
  g("rn").addEventListener("input",rc);g("rb").addEventListener("input",rc);rc();
  const gc=()=>{const n=Math.max(2,+g("gn").value||2);const k=groverK(n);g("gout").innerHTML=`${n.toLocaleString()} boxes: about <b>${k.toLocaleString()}</b> tuned quantum steps (chance ${(groverP(n,k)*100).toFixed(1)}%). One at a time by hand needs up to ${n.toLocaleString()} looks.`};
  g("gn").addEventListener("input",gc);gc();
  root.querySelectorAll("[data-jump]").forEach(b=>b.addEventListener("click",()=>openAns(b.dataset.jump)));
}
function openAns(id){
  const d=document.getElementById(id);if(!d)return;
  document.querySelectorAll("#main details.accbox").forEach(x=>x.open=false);d.open=true;
  d.scrollIntoView({behavior:"smooth",block:"start"});
}

["Quantum","Are Shor's and Grover's algorithms real?","Yes. Shor's was published in 1994 and Grover's in 1996. The code shown is a plain-English version of the real steps."],
["Quantum","Will quantum break my bank account tomorrow?","No. No machine big enough exists. The concern is about data captured now and opened in the future."],
["Quantum","What is 'harvest now, decrypt later'?","Someone copies encrypted data today, stores it, and waits until a quantum computer can open it. It matters most for data that must stay secret for many years."],
["Quantum","What is the bank doing about it?","Do not speak for the bank. Say that standards bodies such as NIST published the first post-quantum encryption standards in August 2024, and organisations are planning to move. Point to the security team."],
["Quantum","When will quantum computers be a real threat?","Estimates vary widely. The session text says 10 to 20 years for machines that matter. Nobody knows, and the honest answer is uncertainty."],
["Quantum","Why does Grover need 6 steps for 64 boxes?","The steps grow with the square root of the boxes. Roughly 0.785 times the square root of 64, which is about 6. Quadruple the boxes and you only double the steps."],
["Quantum","Does quantum make everything faster?","No. Only certain problems, such as searching and factoring, get a proven speed-up."],
["Quantum","Is 'quantum-safe' the same as quantum?","No. Quantum-safe or post-quantum encryption runs on ordinary computers. It is designed to resist quantum attacks."],
["Session","Do I need an account or to install anything?","No. The four resources run in the browser. Scratch needs the internet but no sign-in."],
["Session","Will my progress be saved?","MindForge saves scores in the browser only. The others do not save. Screenshot the certificate."],
["Session","Can I try this at home?","Yes. Give the follow-up link from the Checklists page (Prepare card)."],
["Session","Can I do it on my phone?","The resources work on a phone. A laptop is better for Scratch."],
["Session","Is my data collected?","The four resources run in the browser and send nothing. Scratch is run by MIT and needs no account for this session."],
["Session","I am lost. Is it me?","No. Everyone is lost sometimes. Use Predict, Run, Investigate, Modify: guess, try, look, change one thing."],
["Session","Can I stop early?","Yes, and say it at the start. Even the smallest working version is real software."]
];

/* ============================================================
   GLOSSARY
   ============================================================ */
const GL=[
["Variable","A box with a name that holds a value you can change."],
["Loop","Doing something again. A counted loop runs a set number of times. An until loop keeps going until something is true."],
["Conditional (if)","A question the program asks, then acts on the answer."],
["Event or trigger","Something that happens, like a click, that starts a script."],
["Function","A named set of steps you can run when you need it, like trackPoint()."],
["Algorithm","A set of steps to solve a problem."],
["Linear search","Checking one item at a time, in order."],
["Cipher","A way of scrambling a message. A Caesar cipher shifts each letter along."],
["Interpreter or compiler","The program that reads your code and makes the computer do it."],
["Engine (LoomScript)","A part of the language, such as physics or chemistry, that owns certain commands."],
["Sprite","A character or object on the Scratch stage."],
["Bug and debug","A bug is a mistake in a program. Debugging is finding and fixing it."],
["PRIMM","Predict, Run, Investigate, Modify. A way to learn by guessing first."],
["Grover's algorithm","A quantum method for searching. It needs about the square root of the number of items in steps."],
["Shor's algorithm","A quantum method for finding the factors of a big number. It threatens some encryption."],
["Oracle","A rule that says yes or no to each item without showing how it decided."],
["Post-quantum encryption","Encryption designed to resist quantum computers. It runs on ordinary computers."],
["Harvest now, decrypt later","Copying encrypted data today to open it when quantum computers are big enough."],
["Domain-specific language","A small language built for one job, like a bank's rules language."],
["NIST","The US standards body. It published the first post-quantum encryption standards in August 2024."]
];

  tok=(tok||"").replace("#","");

  if(TOK[tok]){S.view="area";S.area=TOK[tok][0];S.sub[S.area]=TOK[tok][1];return}
  S.view="home";
}

/* ---------- pieces ---------- */
const tile=(id,a)=>`<button class="tile" type="button" data-nav="${id}"><span class="ico">${ICO[a.ico]}</span><h3>${esc(a.t)}</h3><p>${esc(a.d)}</p><span class="go">Open</span></button>`;

function viewHome(){
  const el=document.createElement("div");
  const inProg=S.pos>=0&&S.pos<FLOW.length;
  let hero;
  if(inProg){const f=FLOW[S.pos];hero=`<button class="tile hero-tile" type="button" data-nav="run"><span class="ico">${ICO.play}</span><div><span class="pill now">In progress</span><h3>Resume the session</h3><p>Part ${f.seg+1} of ${PL.length}: ${esc(f.p.s.name)}. Step: ${esc(f.row.st.n)}.</p></div></button>`}
  else{hero=`<button class="tile hero-tile" type="button" data-nav="run"><span class="ico">${ICO.play}</span><div><span class="pill self">Start here on the day</span><h3>Run the session</h3><p>One step at a time. What to say, what to do, and the clock. Press NEXT to move on. You can click through it once to rehearse.</p></div></button>`}
  el.innerHTML=`<section class="hero"><p class="eyebrow">Facilitator Desk</p><h1>Pivot into Tech</h1>
   <p class="lead">Thank you for doing this. Everything is here, one card at a time. It is a taster, nobody is tested, and nothing on this page can break.</p></section>
   ${hero}
   <h2 class="sect">Your path</h2>
   <div class="path"><span><b>1</b>Before the day: Prepare</span><span><b>2</b>On the day: Run the session</span><span><b>3</b>If it goes wrong: Panic</span></div>
   <h2 class="sect">Everything else</h2>
   <div class="tiles">${AREAS.map(a=>tile(a.id,a)).join("")}</div>
   <h2 class="sect">Downloads</h2>
   <div class="grid2">
    <div class="dl"><span class="ico">${ICO.down}</span><div><b>Facilitator deck (.pptx)</b><span class="sub">27 slides with speaker notes</span></div><a class="btn primary" href="${DECK_FILE}" download>Download</a></div>
    <div class="dl"><span class="ico">${ICO.down}</span><div><b>Session analysis (.docx)</b><span class="sub">Timings, personas, risks, Joe's review</span></div><a class="btn primary" href="${DOC_FILE}" download>Download</a></div>
   </div>
   <p class="sub" style="margin-top:26px">Ticks and settings are saved in this browser only. The two downloads sit in the same folder as this page.</p>`;
  return el;
}

function railHTML(){
  const cs=curSeg();
  return PL.map((p,i)=>{
    const skip=firstIdx(i)<0;
    const st=skip?"skip":(S.pos>=FLOW.length?"done":cs===null?"later":i<cs?"done":i===cs?"now":"later");
    return `<button class="pc ${p.s.kind} ${st}" type="button" ${skip?"disabled":""} data-part="${i}" ${st==="now"?'aria-current="step"':""}><span class="pn">${st==="done"?"\u2713":i+1}</span><span class="pt"><b>${esc(p.s.name)}</b><small>${wall(p.start)} \u00b7 ${p.dur} min${skip?" \u00b7 skipped":""}</small></span></button>`;
  }).join("");
}

function viewRun(){
  const el=document.createElement("div");el.className="pres";
  const stage=S.pos<0?readyHTML():S.pos>=FLOW.length?doneHTML():stepHTML();
  el.innerHTML=`<aside class="rail" aria-label="Parts of the session"><p class="railh">Parts of the session</p>${railHTML()}</aside><div class="stagewrap"><div class="cue" id="cue" role="status"></div><div id="lateBox"></div>${stage}</div>`;
  return el;
}

function stepHTML(){
  const f=FLOW[S.pos],seg=f.p.s,r=f.row,st=r.st;
  const mine=FLOW.map((x,i)=>[x,i]).filter(x=>x[0].seg===f.seg);
  const idx=mine.findIndex(x=>x[1]===S.pos);
  const nx=FLOW[S.pos+1];
  const nextLbl=!nx?"Finish the session":(nx.seg!==f.seg?"Next part: "+PL[nx.seg].s.name:nx.row.st.n);
  const kind=seg.kind==="self"?"Self-paced":seg.kind==="group"?"Group-run":"Breather";
  const say=(st.say||[]).map(x=>`<p>${esc(x.replace("{TOTAL}",TOTALS[S.mode]))}</p>`).join("");
  const doL=(st.do||[]).map(x=>`<li><span>${esc(x)}</span></li>`).join("");
  const watch=(st.watch||[]).map(x=>`<li>${esc(x)}</li>`).join("");
  return `<article class="stage k-${seg.kind}">
   <div class="stagehead"><div><p class="eyebrow">Part ${f.seg+1} of ${PL.length} \u00b7 ${kind}</p><p class="partname">${esc(seg.name)}</p></div>
    <div class="left"><small>Time left in this part</small><b id="partLeft">--:--</b></div></div>
   ${idx===0?`<p class="goal"><b>Goal of this part.</b> ${esc(seg.goal)}</p>`:""}
   <div class="dots" aria-label="Steps in this part">${mine.map((x,i)=>`<button type="button" data-step="${x[1]}" class="${x[1]===S.pos?"cur":i<idx?"on":""}" aria-label="Step ${i+1}: ${esc(x[0].row.st.n)}"></button>`).join("")}</div>
   <p class="stepno">Step ${idx+1} of ${mine.length}</p>
   <h1 class="stepname">${esc(st.n)}</h1>
   <div class="badges"><span class="pill">${r.d} min</span><span class="pill">${wall(r.start)} to ${wall(r.end)}</span>${st.moment?'<span class="pill moment">Mic drop</span>':""}${r.buffer?'<span class="pill">Remote buffer</span>':""}</div>
   ${say?`<div class="blk say"><span class="lbl">Say</span>${say}</div>`:""}
   ${typeof st.moment==="string"?`<div class="moment-box"><b>Mic drop.</b> ${esc(st.moment)}</div>`:""}
   ${doL?`<div class="blk dob"><span class="lbl">Do</span><ol class="dolist">${doL}</ol></div>`:""}
   ${watch?`<div class="blk watchb"><span class="lbl">Watch for</span><ul>${watch}</ul></div>`:""}
   ${st.ans?`<div class="actions"><button class="btn" type="button" data-ans="${st.ans}">Open the answers for this step</button></div>`:""}
  </article>
  <div class="actbar"><button class="back" type="button" data-back>\u2039 Back</button><button class="next" type="button" data-next><b>NEXT \u203a</b><small>${esc(nextLbl)}</small></button></div>
  <p class="hint">Tip: on a laptop the left and right arrow keys work too.</p>`;
}

const MODEINFO=[["Full","97","Everything in the session, with room to breathe. A little over 90."],["Core","82","The recommended run. Balanced."],["Express","67","Tightest. Skips the loops and both breathers."]];
function readyHTML(){
  const tot=total();
  return `<article class="stage">
   <p class="eyebrow">Before you start</p><h1 class="stepname">Ready when you are</h1>
   <p class="lead" style="margin:0 0 6px">Pick how long you have. If you are unsure, choose Core.</p>
   <div class="modes" role="group" aria-label="Session length">${MODEINFO.map((m,i)=>`<button class="modecard" type="button" data-mode="${i}" aria-pressed="${S.mode===i}">${i===1?'<span class="pill self rec">Recommended</span>':""}<b>${m[0]}</b><span class="mins">${m[1]} min</span><span>${m[2]}</span></button>`).join("")}</div>
   <div class="setrow"><label><input type="checkbox" id="remoteChk" ${S.remote?"checked":""}> Someone is dialling in remotely (adds 5 minutes)</label>
    <label>Doors open at <input type="time" id="doorsIn" value="${esc(S.doors)}"></label></div>
   <div class="summary">${MODES[S.mode]} takes ${tot} minutes${S.remote?" with the remote buffer":""}.${/^\d\d:\d\d$/.test(S.doors)?` You finish at about ${wall(tot)}.`:" Add the time the doors open and every part shows real clock times."}</div>
   <div class="blk dob"><span class="lbl">Before you press start</span><ol class="dolist"><li><span>Helpers are on the floor and people are already playing MindForge, the afternoon starter.</span></li><li><span>The projector or screen share is on and the sound is low.</span></li><li><span>You have water, and you have read the Panic card once.</span></li></ol></div>
  </article>
  <div class="actbar"><button class="back" type="button" data-browse>Browse without the clock</button><button class="next" type="button" data-next><b>${S.started?"CONTINUE \u203a":"START THE SESSION \u203a"}</b><small>${S.started?"Carry on where you left off":"The clock starts at 00:00 when the block starts, after the MindForge starter"}</small></button></div>`;
}
function doneHTML(){
  return `<article class="stage"><p class="eyebrow">Finished</p><h1 class="stepname">That is a wrap. Well done.</h1>
   <p class="lead">Thank everyone, thank the helpers by name, and point to the follow-up link and contact.${S.started?` Total time: ${hms(S.elapsed)}.`:""}</p>
   <div class="actions">${copyBtn("thanks",MSG_THANKS,"Copy the thank-you message for helpers")}<button class="btn" type="button" data-nav="prep">Send the report-back (Prepare)</button><button class="btn" type="button" data-nav="home">Home</button></div></article>
   <div class="actbar"><button class="back" type="button" data-back>\u2039 Back</button><button class="next" type="button" data-nav="home"><b>HOME</b><small>Back to all the cards</small></button></div>`;
}

function viewArea(){
  const a=AREAS.find(x=>x.id===S.area);
  const el=document.createElement("div");el.className="pres";
  const cur=S.sub[S.area];
  el.innerHTML=`<aside class="rail" aria-label="${esc(a.t)} pages"><p class="railh">${esc(a.t)}</p>${SUBS[S.area].map(s=>`<button class="pc sub ${s[0]===cur?"now":""}" type="button" data-sub="${s[0]}" ${s[0]===cur?'aria-current="page"':""}><b>${esc(s[1])}</b><small>${esc(s[2])}</small></button>`).join("")}</aside><div class="content" id="content"></div>`;
  const c=el.querySelector("#content");
  if(S.area==="answers")c.appendChild(answersPage(cur));else c.appendChild(RENDER[S.area][cur]());
  return el;
}
const RENDER={
  help:{panic:()=>renderPanic(),questions:()=>renderQA(),fixes:()=>renderFix(),gloss:()=>renderGlossary()},
  team:{helpers:()=>renderTeam(),briefing:()=>renderBriefing(),people:()=>renderPeople()},
  prep:{checks:()=>renderChecklists(),rehearsal:()=>renderRehearsal(),kit:()=>renderKit(),messages:()=>renderMessages()},
  plan:{overview:()=>renderPlan(),walk:()=>renderWalk(),files:()=>renderFiles()}
};
function answersPage(id){
  const w=document.createElement("div");w.className="ansall";
  const all=renderAnswers();
  const hr=all.querySelector(".h-row");hr&&hr.remove();const ch=all.querySelector("#ansChips");ch&&ch.remove();
  w.appendChild(all);
  const d=all.querySelector("#ans-"+id);
  if(d){d.classList.add("solo");d.open=true;const t=d.querySelector("summary").textContent;const h=document.createElement("div");h.className="h-row";h.innerHTML=`<h2>${esc(t)}</h2>`;d.insertBefore(h,d.querySelector(".in"))}
  bindAnswers(w);
  return w;
}

function renderFiles(){
  const el=document.createElement("div");
  const det=load("res",{});
  el.innerHTML=`<div class="h-row"><div><h2>Files and links</h2><p class="sub">Everything that goes with this Desk lives in the same folder.</p></div></div>
  <div class="grid2">
   <div class="dl"><span class="ico">${ICO.down}</span><div><b>Facilitator deck (.pptx)</b><span class="sub">27 slides with speaker notes. Use it on the big screen.</span></div><a class="btn primary" href="${DECK_FILE}" download>Download</a></div>
   <div class="dl"><span class="ico">${ICO.down}</span><div><b>Session analysis (.docx)</b><span class="sub">Timings, persona walkthrough, risks and Joe's review.</span></div><a class="btn primary" href="${DOC_FILE}" download>Download</a></div>
  </div>
  <div class="note"><b>Nothing happens when you click?</b> Make sure the deck and document sit in the same folder as this page. On GitHub Pages that means the same directory of the repository.</div>
  <h3 style="margin:18px 0 10px">The four games</h3>
  <div class="grid2">${RES.map(x=>`<div class="dl"><div><b>${x[1]}</b><span class="sub" id="${x[0]}t">${esc(det[x[0]]||x[2])}</span></div><a class="btn primary" id="${x[0]}a" href="${esc(det[x[0]]||x[2])}" target="_blank" rel="noopener">Open</a></div>`).join("")}</div>
  <details class="accbox" style="margin-top:14px"><summary>Games live somewhere else? Use a different address</summary><div class="in"><p class="sub">Paste the full web address. It is saved in this browser only.</p><div class="fields" style="flex-direction:column;align-items:stretch">${RES.map(x=>`<label>${x[1]}<input class="field" style="width:100%" id="${x[0]}" type="url" placeholder="${x[2]}" value="${esc(det[x[0]]||"")}"></label>`).join("")}</div></div></details>
  <div class="card" style="margin-top:14px"><h3>Scratch</h3><p>Compound Click uses Scratch. Open <b>scratch.mit.edu</b> and choose Create. No account is needed. Test it on the venue network.</p></div>`;
  RES.forEach(x=>el.querySelector("#"+x[0]).addEventListener("input",e=>{
    const d=load("res",{});d[x[0]]=e.target.value.trim();store("res",d);
    const v=/^https?:\/\//.test(d[x[0]])?d[x[0]]:x[2];
    el.querySelector("#"+x[0]+"a").href=v;el.querySelector("#"+x[0]+"t").textContent=v;
  }));
  return el;
}

/* ---------- top bar ---------- */
function renderTop(){
  const sep='<span class="sep" aria-hidden="true">\u203a</span>';
  let cr=`<button class="crumb" type="button" data-nav="home">Home</button>`;
  if(S.view==="run")cr+=sep+`<span class="crumb cur">Run the session</span>`;
  else if(S.view==="area"){const a=AREAS.find(x=>x.id===S.area);const s=SUBS[S.area].find(x=>x[0]===S.sub[S.area]);cr+=sep+`<span class="crumb">${esc(a.t)}</span>`+sep+`<span class="crumb cur">${esc(s[1])}</span>`}
  const inSess=S.pos>=0&&S.view!=="run";
  $("#top").innerHTML=`<div class="wrap"><button class="logo" type="button" data-nav="home" aria-label="Home"><i>P</i><span>Facilitator Desk</span></button><nav class="crumbs" aria-label="Where you are">${cr}</nav><span class="grow"></span>
   ${inSess?`<button class="pillbtn back" type="button" data-nav="run">Back to the session</button>`:""}
   ${S.view==="run"?`<div class="clockbox"><span id="clockT">00:00:00</span><button class="pillbtn" type="button" id="clkBtn" data-clock></button>${S.started?`<button class="pillbtn" type="button" id="rstBtn" data-reset>Reset</button>`:""}</div>`:""}
   <button class="pillbtn panic" type="button" data-nav="panic">Panic card</button></div>`;
}

/* ---------- live updates (clock, cue, late box) ---------- */
let lateCache="";
function updateDesk(){
  const c=$("#clockT");if(c)c.textContent=hms(S.elapsed);
  const b=$("#clkBtn");if(b)b.textContent=!S.started?"Start clock":S.running?"Pause":"Resume";
  if(S.view!=="run")return;
  const cue=$("#cue");if(!cue)return;
  cue.className="cue";
  const cs=curSeg(),pl=$("#partLeft");
  if(S.pos>=FLOW.length){cue.classList.add("ok");cue.textContent="Session complete. Thank everyone and hand over to the helpers.";return}
  if(!S.started){cue.textContent=S.pos<0?"The clock is off. It starts when you press START THE SESSION.":"The clock is off, so you are browsing. Press Start clock at the top when the session really begins.";if(pl)pl.textContent="--:--";return}
  if(!S.running){cue.classList.add("warn");cue.textContent="Paused at "+ms(S.elapsed)+". Press Resume at the top.";return}
  if(cs===null){cue.textContent="Clock running. Press NEXT to open Part 1.";return}
  const p=PL[cs];const start=S.segStart[cs]!==undefined?S.segStart[cs]:p.start*60;
  const left=start+p.dur*60-S.elapsed;const d=drift();
  const dTxt=Math.abs(d)<30?"on time":(d>0?ms(d)+" behind plan":ms(-d)+" ahead of plan");
  if(pl)pl.textContent=left<0?"+"+ms(-left)+" over":ms(left);
  if(left<0){const o=-left;cue.classList.add(o>180?"bad":"warn");cue.textContent="Over by "+ms(o)+" on "+p.s.name+". "+(o>180?"Wrap up now and move on.":"Start wrapping up.")+" ("+dTxt+")"}
  else if(left<=120){cue.classList.add("warn");cue.textContent=ms(left)+" left in this part. Start the wrap-up line. ("+dTxt+")"}
  else cue.textContent="You are "+dTxt+".";
  let html="";
  if(d>=180){
    let need=d/60;const items=[];
    CUTS.forEach(x=>{const idx=PL.findIndex(q=>q.s.id===x.seg);const m=x.mins[S.mode];if(need>0&&m>0&&idx>=cs&&items.length<3){items.push(`<li>${esc(x.label)} <span class="pill">saves ${m} min</span></li>`);need-=m}});
    if(items.length)html=`<div class="late"><b>You are ${ms(d)} behind.</b> Cut these, in this order:<ul>${items.join("")}</ul></div>`;
  }
  if(html!==lateCache){lateCache=html;const lb=$("#lateBox");if(lb)lb.innerHTML=html}
}

/* ---------- render ---------- */
function render(){
  buildFlow();lateCache="";
  const m=$("#app");
  const v=S.view==="home"?viewHome():S.view==="run"?viewRun():viewArea();
  m.replaceChildren(v);
  renderTop();updateDesk();
  const cur=m.querySelector(".rail .pc.now");
  if(cur){const rail=cur.parentElement;if(rail.scrollHeight>rail.clientHeight||rail.scrollWidth>rail.clientWidth){rail.scrollTop=cur.offsetTop-rail.offsetTop-80;rail.scrollLeft=cur.offsetLeft-rail.offsetLeft-20}}
}

/* ---------- events (delegated) ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-nav],[data-part],[data-step],[data-next],[data-back],[data-browse],[data-mode],[data-sub],[data-ans],[data-copy],[data-clock],[data-reset]");
  if(!t)return;
  if(t.dataset.copy){copyText(COPY[t.dataset.copy]||"");return}
  if(t.dataset.nav!==undefined){
    const v=t.dataset.nav;
    if(v==="home")nav("home");else if(v==="run")nav("run");
    else if(v==="panic")nav("area","help","panic");
    else nav("area",v,S.sub[v]||DEFSUB[v]);
    return;
  }
  if(t.dataset.sub){S.sub[S.area]=t.dataset.sub;setHash();render();window.scrollTo(0,0);return}
  if(t.dataset.ans){nav("area","answers",t.dataset.ans.replace("ans-",""));return}
  if(t.dataset.part!==undefined){go(firstIdx(+t.dataset.part));return}
  if(t.dataset.step!==undefined){go(+t.dataset.step);return}
  if(t.dataset.next!==undefined){next();return}
  if(t.dataset.back!==undefined){back();return}
  if(t.dataset.browse!==undefined){go(0);return}
  if(t.dataset.mode!==undefined){S.mode=+t.dataset.mode;save();render();return}
  if(t.dataset.clock!==undefined){if(!S.started||!S.running)runClock();else pauseClock();updateDesk();return}
  if(t.dataset.reset!==undefined){
    if(!S.confirmReset){S.confirmReset=true;t.textContent="Tap again to reset";setTimeout(()=>{S.confirmReset=false;if(t.isConnected)t.textContent="Reset"},3000);return}
    S.confirmReset=false;resetAll();
  }
});
document.addEventListener("change",e=>{
  if(e.target.id==="remoteChk"){S.remote=e.target.checked;save();render()}
  if(e.target.id==="doorsIn"){S.doors=e.target.value;save();render()}
});
document.addEventListener("keydown",e=>{
  if(S.view!=="run"||/INPUT|TEXTAREA|SELECT/.test((e.target.tagName||"")))return;
  if(e.key==="ArrowRight"||e.key==="PageDown"){e.preventDefault();next()}
  if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();back()}
});
window.addEventListener("hashchange",()=>{fromHash(location.hash);render()});

(function init(){
  S.mode=load("mode",1);S.remote=!!load("remote",false);S.doors=load("doors","");
  const r=load("run",null);
  if(r){S.pos=r.pos;S.started=!!r.started;S.elapsed=r.elapsed||0;S.segStart=r.segStart||{};
    if(r.running){S.elapsed=(Date.now()-r.base)/1000;S.running=true;S.base=r.base;startTick();reqWake()}}
  buildFlow();
  fromHash(location.hash);
  render();
})();

</script>
</body></html>
