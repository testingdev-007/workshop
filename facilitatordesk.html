<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Facilitator Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;600&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: a control-room desk. Sticky clock bar on top, tab strip beneath, one working panel below.
   The desk is used standing up, on a phone or a laptop, so everything is large, scannable and one tap away. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface2:#F5F7FA; --ink:#14202B; --muted:#54657A; --line:#D3DBE4;
  --accent:#0A7C76; --accent-ink:#FFFFFF; --accent-soft:#D9F0EE;
  --group:#3B4FC4; --group-soft:#E3E7FA;
  --moment:#B45A00; --moment-soft:#FCE9D2;
  --warn:#9A6400; --warn-soft:#FBEFC9;
  --bad:#B3261E; --bad-soft:#FADAD6;
  --ok:#1E7A3C; --ok-soft:#D8F0DF;
  --break:#6B7785;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D141B; --surface:#152029; --surface2:#1B2833; --ink:#E7EEF4; --muted:#9FB0C0; --line:#26384A;
  --accent:#3CC7BD; --accent-ink:#04211F; --accent-soft:#12413F;
  --group:#8F9DFF; --group-soft:#222B5C;
  --moment:#FFB35C; --moment-soft:#4A3110;
  --warn:#F2C14E; --warn-soft:#41330E;
  --bad:#FF8A80; --bad-soft:#4B1F1B;
  --ok:#6FD68B; --ok-soft:#173D24;
  --break:#8797A8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D141B; --surface:#152029; --surface2:#1B2833; --ink:#E7EEF4; --muted:#9FB0C0; --line:#26384A;
  --accent:#3CC7BD; --accent-ink:#04211F; --accent-soft:#12413F;
  --group:#8F9DFF; --group-soft:#222B5C;
  --moment:#FFB35C; --moment-soft:#4A3110;
  --warn:#F2C14E; --warn-soft:#41330E;
  --bad:#FF8A80; --bad-soft:#4B1F1B;
  --ok:#6FD68B; --ok-soft:#173D24;
  --break:#8797A8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0 0 .6em}
a{color:var(--accent)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
code,.mono{font-family:var(--f-mono);font-size:.88em}
code{background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:.05em .35em}
.wrap{max-width:1100px;margin-inline:auto;padding-inline:16px}

/* ---------- desk bar ---------- */
.desk{background:var(--surface)}
.deskstick{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.desk-top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.15rem;letter-spacing:-.01em;margin-right:auto;min-width:0}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.seg-ctl{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2)}
.seg-ctl button{border:0;background:transparent;padding:8px 12px;font-weight:600;font-size:.9rem;min-height:40px}
.seg-ctl button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:.9rem;font-weight:500;min-height:40px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.iconbtn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 12px;min-height:40px;font-weight:600;font-size:.9rem}
.clockrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding-bottom:10px}
.clock{font-family:var(--f-mono);font-weight:600;font-size:2rem;letter-spacing:.02em;line-height:1;font-variant-numeric:tabular-nums}
.clock small{font-size:.7rem;color:var(--muted);font-family:var(--f-body);font-weight:500;display:block;letter-spacing:.06em;text-transform:uppercase}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 14px;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.small{min-height:36px;padding:6px 10px;font-size:.88rem}
.nownext{flex:1 1 320px;min-width:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nn{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.nn b{display:block;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.nn span{display:block;font-weight:600;overflow-wrap:anywhere}
.nn.now{border-color:var(--accent);background:var(--accent-soft)}
.cue{margin:0 0 10px;padding:9px 12px;border-radius:10px;font-weight:600;background:var(--surface2);border:1px solid var(--line)}
.cue.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--ink)}
.cue.bad{background:var(--bad-soft);border-color:var(--bad)}
.cue.ok{background:var(--ok-soft);border-color:var(--ok)}
.bar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--line);position:relative;margin-bottom:10px}
.bar button{border:0;padding:0;height:100%;border-right:2px solid var(--surface);min-width:3px}
.bar button.self{background:var(--accent)} .bar button.group{background:var(--group)} .bar button.break{background:var(--break)}
.bar button.cur{outline:3px solid var(--ink);outline-offset:-3px}
.bar i{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--bad);border-radius:2px;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.78rem;color:var(--muted);margin:-4px 0 10px}
.legend s{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;text-decoration:none}

.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:0;scrollbar-width:thin}
.tabs button{flex:0 0 auto;border:0;border-bottom:3px solid transparent;background:transparent;padding:10px 12px;font-weight:600;color:var(--muted);min-height:44px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* ---------- panels ---------- */
main{padding-block:18px 60px}
.panel[hidden]{display:none!important}
.h-row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:end;justify-content:space-between;margin-bottom:12px}
.h-row h2{font-size:1.6rem}
.sub{color:var(--muted);margin:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.card h3{font-size:1.1rem;margin-bottom:8px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.self{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.group{background:var(--group-soft);color:var(--group);border-color:transparent}
.pill.moment{background:var(--moment-soft);color:var(--moment);border-color:transparent}
.pill.now{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.pill.late{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}

.segcard{background:var(--surface);border:1px solid var(--line);border-left-width:6px;border-radius:14px;margin-bottom:12px;overflow:hidden}
.segcard.self{border-left-color:var(--accent)} .segcard.group{border-left-color:var(--group)} .segcard.break{border-left-color:var(--break)}
.segcard[data-st="now"]{box-shadow:0 0 0 2px var(--accent)}
.segcard[data-st="done"]{opacity:.72}
.seghead{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:12px 14px;min-height:56px}
.seghead .t{font-family:var(--f-mono);font-weight:600;font-size:.95rem;color:var(--muted);min-width:8.5em}
.seghead .nm{font-family:var(--f-display);font-weight:700;font-size:1.15rem;line-height:1.15;flex:1 1 200px;min-width:0}
.segbody{padding:4px 16px 16px;border-top:1px solid var(--line)}
.goal{background:var(--surface2);border-radius:10px;padding:10px 12px;margin:12px 0}
.step{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px}
.step:first-of-type{border-top:0;margin-top:0;padding-top:0}
.step[data-skip="1"]{opacity:.5}
.step h4{font-size:1.02rem;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.step h4 .t{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);font-weight:600}
.lbl{font-size:.7rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px;display:block}
.say{margin:0;border-left:4px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 10px 10px 0}
.say p{margin:.25em 0}
.moment-box{border:2px solid var(--moment);background:var(--moment-soft);border-radius:12px;padding:10px 14px;margin-top:10px}
.moment-box b{color:var(--moment)}
ul.tight{margin:0;padding-left:1.15em} ul.tight li{margin:.15em 0}
.watch li::marker{color:var(--warn)}
.watch{background:var(--warn-soft);border-radius:10px;padding:8px 12px 8px 1.6em;margin:0}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{border-bottom:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--surface2);position:sticky;top:0}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:8px 0 14px}
.tw table{min-width:520px}
.num{font-variant-numeric:tabular-nums}
.key{font-weight:700;color:var(--ok)}
.accbox{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:10px}
.accbox>summary{list-style:none;cursor:pointer;padding:14px 16px;font-family:var(--f-display);font-weight:700;font-size:1.1rem;display:flex;gap:10px;align-items:center;min-height:52px}
.accbox>summary::-webkit-details-marker{display:none}
.accbox>summary::after{content:"+";margin-left:auto;font-family:var(--f-mono);font-size:1.3rem;color:var(--muted)}
.accbox[open]>summary::after{content:"\2212"}
.accbox .in{padding:0 16px 16px}
.tool{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.tool h4{font-size:1rem;margin-bottom:8px}
.fields{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:end}
.fields label{display:flex;flex-direction:column;font-size:.78rem;color:var(--muted);font-weight:600;gap:3px}
.fields input,.fields select,.field{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;width:6.5em}
.fields select{width:auto;max-width:100%}
.out{margin-top:10px;font-family:var(--f-mono);font-size:.9rem;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;overflow-wrap:anywhere}
.search{width:100%;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:1.05rem;min-height:48px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.85rem;min-height:36px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.qa{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.qa summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none;display:flex;gap:10px;min-height:48px;align-items:center}
.qa summary::-webkit-details-marker{display:none}
.qa summary::before{content:"Q";font-family:var(--f-mono);color:var(--accent);font-weight:700}
.qa .a{padding:0 14px 14px 34px}
.qa .tag{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-left:auto;padding-left:8px}
.fix{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.fix h4{font-size:1rem;margin-bottom:4px}
.fix dl{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px}
.fix dt{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-top:2px}
.fix dd{margin:0}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:8px 6px;border-bottom:1px solid var(--line);min-height:44px}
.checks input{width:22px;height:22px;margin-top:1px;accent-color:var(--accent);flex:0 0 auto}
.checks label.on span{text-decoration:line-through;color:var(--muted)}
.prog{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0 10px}
.prog i{display:block;height:100%;background:var(--accent);width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:50;max-width:calc(100% - 32px)}
.note{border-left:4px solid var(--moment);background:var(--moment-soft);padding:8px 12px;border-radius:0 10px 10px 0;margin:10px 0}
.note.ok{border-color:var(--ok);background:var(--ok-soft)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}

.subnav{margin-top:0}
.menu{position:relative}
.menu>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center}
.menu>summary::-webkit-details-marker{display:none}
.menubox{position:absolute;right:0;top:calc(100% + 6px);z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);min-width:250px}
.pre{white-space:pre-wrap;font-family:var(--f-body);font-size:.92rem;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 10px;overflow-wrap:anywhere}
.start{border:2px solid var(--accent);background:var(--accent-soft);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.start h3{font-size:1.1rem;margin-bottom:6px}
a.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
@media (max-width:560px){
  .brand{flex-basis:100%}
  .clock{font-size:1.6rem}
  .nownext{grid-template-columns:1fr;flex-basis:100%}
  .nownext .nn:not(.now){display:none}
  .legend{display:none}
  .cue{font-size:.9rem;padding:6px 10px;margin-bottom:8px}
  .clockrow{gap:6px 10px;padding-bottom:6px}
  .btn{padding:8px 12px}
  .seghead .t{min-width:0;flex-basis:100%}
  .fix dl{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.segcard,.card{transition:box-shadow .2s}}
</style>

</head>
<body>
<header class="desk">
  <div class="wrap">
    <div class="desk-top">
      <div class="brand">Pivot into Tech<small>Facilitator Desk</small></div>
      <div class="seg-ctl" role="group" aria-label="Session length" id="modeCtl">
        <button data-mode="0" aria-pressed="false">Full 110</button>
        <button data-mode="1" aria-pressed="true">Core 90</button>
        <button data-mode="2" aria-pressed="false">Express 72</button>
      </div>
      <button class="iconbtn" id="panicBtn" type="button">Panic card</button>
      <details class="menu"><summary class="iconbtn">Settings</summary><div class="menubox">
        <label class="chk"><input type="checkbox" id="remoteChk"> Remote facilitator (+5 min)</label>
        <button class="iconbtn" id="themeBtn" type="button" aria-label="Switch light or dark theme">Switch light or dark</button>
      </div></details>
    </div>
  </div>
</header>
<div class="deskstick">
  <div class="wrap">
    <div class="clockrow" style="padding-top:10px">
      <div class="clock" id="clock" aria-live="off"><small>Session clock</small><span id="clockT">00:00:00</span></div>
      <button class="btn primary" id="startBtn" type="button">Start session</button>
      <button class="btn" id="nextBtn" type="button">Next segment</button>
      <button class="btn small" id="backBtn" type="button">Back</button>
      <button class="btn small" id="resetBtn" type="button">Reset</button>
      <div class="nownext">
        <div class="nn now"><b>Now</b><span id="nowTxt">Not started</span></div>
        <div class="nn"><b>Next</b><span id="nextTxt">MindForge</span></div>
      </div>
    </div>
    <div class="cue" id="cue" role="status">Press Start session when the doors open. The clock runs from 00:00.</div>
    <div class="bar" id="bar" aria-label="Session timeline"></div>
    <nav class="tabs" role="tablist" id="tabs" aria-label="Sections"></nav>
  </div>
</div>

<main class="wrap" id="main"></main>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* ============================================================
   DATA
   Durations are minutes as [Full, Core, Express].
   ============================================================ */
const MODES=["Full","Core","Express"];
const TOTALS=[110,90,72];
const SEGS=[
{id:"mf",name:"MindForge and arrival",kind:"self",dur:[10,8,5],goal:"People arrive, sit, and start solving small puzzles on their own. Energy up, nerves down. You say almost nothing yet.",
 steps:[
 {n:"Doors open, greet, settle",d:[3,3,2],say:["Hello, come in, pick any seat. Open the first screen and press Start. Nothing in here can break."],
  do:["Helpers greet every person by name and point at the screen.","Check every laptop has 01 MindForge open. Sound low or off.","Facilitator stays at the front, smiling, and does not start talking yet."],
  watch:["Anyone standing at the edge of the room and not clicking. A helper sits beside them for one minute.","Shared machines: earlier progress can appear. It is only a score, ignore it."]},
 {n:"Self-paced play",d:[7,5,3],say:["Play whatever you like. There is no order and no score to beat. If a puzzle feels easy, try the harder level. If it feels hard, skip to another.","(At one minute left) One more minute. Finish the puzzle you are on."],
  do:["Helpers circulate. Point out harder levels for fast people (Sequence Sense has difficulty tiers).","No answers are needed for MindForge. The point is warm-up, not marking.","At the end, ask two people what they liked. Applaud."],
  watch:["Do not let this run over. Stop at the planned end even if people are enjoying it.","If a person is frustrated, say: 'Skipping is allowed. Every good programmer skips and comes back.'"]}
 ]},
{id:"welcome",name:"Welcome and ground rules",kind:"group",dur:[4,3,2],goal:"Set the tone: it is fun, it is safe, it is a taster. Name the three rules and the four parts of today.",
 steps:[
 {n:"Hook and promise",d:[1,1,1],say:["Welcome to Pivot into Tech. In the next {TOTAL} minutes you will break a rollercoaster, crack a vault and build a small app.","Nobody here needs any coding experience. Nobody will be tested. You keep everything you make."],
  do:["Stand still. Speak slowly. Look at the whole room.","If remote: confirm the room can hear and see you. Ask a helper to give you a thumbs up."]},
 {n:"Ground rules",d:[2,1,1],say:["Three rules. One: it is fine to stop early. Two: it is fine to ask a helper, and helpers will point, not click for you. Three: if you are lost for a minute, that is normal. Being lost and then finding the way is what coding feels like for everyone.","Today is a taster. It does not promise a job. It shows you what the work feels like, so you can decide if you want more."],
  do:["Point to the helpers and ask them to wave.","Say once, clearly, where the toilets and exits are."],
  watch:["Career anxiety in the room (near retirement, redundancy worries). Keep the tone honest and warm. Do not promise outcomes."]},
 {n:"Map of the session",d:[1,1,0],say:["First: MindForge, done. Second: LoomSTEM, where we build with blocks together. Third: the Vault, a heist where you learn to code your way out. Last: you build your own small app."],
  do:["Optional: show the agenda slide. Skip it in Express."]}
 ]},
{id:"loom",name:"LoomSTEM, group-run",kind:"group",dur:[28,22,15],slack:2,goal:"Everyone drags blocks together. They see physics react to what they build. Then the reveal: the language they just used is our own.",
 steps:[
 {n:"Open and orient",d:[1,1,1],say:["Open 02 LoomSTEM. Choose Rollercoaster. You will drag blocks into the grey box. When I say run, press Run."],
  do:["Helpers check every screen shows the Rollercoaster and not the hub.","Show how to drag: click, hold, move, let go. Say it out loud."],
  watch:["Trackpad users: dragging is the hardest part. Tell them to click and hold with one finger while moving with another, or use a mouse."]},
 {n:"Rollercoaster, steps 1 to 5",d:[6,5,5],ans:"ans-coaster",
  say:["Step 1: set gravity to 9.8. That is the real value on Earth.","Step 2: place the top of the ride, 80 metres.","Step 3: a small dip to 75 metres. Now press Run. What do you think the rating will be? (Wait for guesses.) It is low. Too tame.","Step 4: a big drop to 10 metres. Step 5: level out at 45 metres. Run it again."],

 {seg:"vault",label:"Skip the Vault quiz, go straight to the certificate",mins:[1,1,0]},
 {seg:"loom",label:"Skip Rollercoaster Part 2 (loops)",mins:[9,7,0]},
 {seg:"vault",label:"Skip the routing code",mins:[3,2,3]},
 {seg:"ccs",label:"Tell people to stop after Step 4",mins:[4,3,2]},
 {seg:"close",label:"One volunteer only in the showcase",mins:[1,1,1]},
 {seg:"br1",label:"Shorten the first breather to one minute",mins:[2,1,0]}
];
const EXTRAS=["Loom: Build an Adventure (10 steps), for early finishers, about 8 minutes","Quantum Playground, seven mini-labs, about 10 minutes for keen people","Compound Click extensions: random returns, compound interest, expenses, milestone broadcast"];

/* ============================================================
   STATE
   ============================================================ */
const S={mode:1,remote:false,tab:"run",running:false,elapsed:0,cur:-1,segStart:[],base:0,open:{}};
function store(k,v){try{localStorage.setItem("ptt_"+k,JSON.stringify(v))}catch(e){}}
function load(k,d){try{const v=localStorage.getItem("ptt_"+k);return v===null?d:JSON.parse(v)}catch(e){return d}}

function segDur(s){return s.dur[S.mode]+(S.remote&&s.slack?s.slack:0)}
function plan(){let t=0;return SEGS.map(s=>{const d=segDur(s);const o={s,start:t,end:t+d,dur:d};t+=d;return o})}
function total(){return plan().reduce((a,p)=>a+p.dur,0)}
const hm=m=>{m=Math.max(0,Math.round(m));return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
const hms=sec=>{sec=Math.max(0,Math.floor(sec));return String(Math.floor(sec/3600)).padStart(2,"0")+":"+String(Math.floor(sec%3600/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")};
const ms=sec=>{const neg=sec<0;sec=Math.abs(Math.round(sec));return (neg?"-":"")+String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0")};
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

/* ============================================================
   RUN OF SHOW
   ============================================================ */
function stepRows(seg,segStartMin){
  let t=segStartMin;const rows=[];
  seg.steps.forEach(st=>{const d=st.d[S.mode];rows.push({st,d,start:t,end:t+d});t+=d});
  if(S.remote&&seg.slack){rows.push({st:{n:"Remote buffer for lag and screen-share delay",d:[seg.slack,seg.slack,seg.slack],say:[],do:["Use this only if the link is slow. If not needed, move on early and gain the time."],watch:[]},d:seg.slack,start:t,end:t+seg.slack,buffer:true})}
  return rows;
}
function renderRun(){
  const P=plan();
  const el=document.createElement("div");
  const total_=total();
  let h=`<div class="h-row"><div><h2>Run of show</h2><p class="sub">${MODES[S.mode]}, ${total_} minutes${S.remote?", remote":""}. Times run from 00:00. Protect the reveal, the red button and the showcase.</p></div>
   <div class="actions" style="margin:0"><button class="btn small" id="expandAll" type="button">Open all</button><button class="btn small" id="collapseAll" type="button">Close all</button><button class="btn small" id="copySheet" type="button">Copy run sheet</button></div></div>`;
  if(!load("hidestart",false)){h+=`<div class="start"><h3>First time here? Three steps</h3><ol class="tight"><li>Before the day: open <b>Prep</b> and do the Rehearsal.</li><li>On the day: choose your length above, then press <b>Start session</b>. This page tells you what to say and do next.</li><li>Stuck? Press <b>Panic card</b> at the top, or open <b>Help</b>.</li></ol><div class="actions"><button class="btn small" id="hideStart" type="button">Got it, hide this</button></div></div>`}
  P.forEach((p,i)=>{
    const st=segState(i);
    const seg=p.s;
    const kindLbl=seg.kind==="self"?"Self-paced":seg.kind==="group"?"Group-run":"Breather";
    const isMoment=seg.steps.some(x=>x.moment);
    const open=S.open[seg.id]!==undefined?S.open[seg.id]:(st==="now"||(S.cur<0&&i===0));
    const rows=stepRows(seg,p.start);
    h+=`<article class="segcard ${seg.kind}" id="seg-${seg.id}" data-st="${st}">
      <button class="seghead" type="button" data-toggle="${seg.id}" aria-expanded="${open}">
        <span class="t">${hm(p.start)} to ${hm(p.end)}</span>
        <span class="nm">${esc(seg.name)}</span>
        <span class="pill ${seg.kind==='self'?'self':seg.kind==='group'?'group':''}">${kindLbl}</span>
        ${isMoment?'<span class="pill moment">Mic drop</span>':''}
        <span class="pill">${p.dur} min</span>
        ${st==="now"?'<span class="pill now">Now</span>':st==="done"?'<span class="pill done">Done</span>':''}
      </button>
      <div class="segbody" ${open?"":"hidden"}>
       <div class="goal"><b>Goal.</b> ${esc(seg.goal)}</div>`;
    rows.forEach(r=>{
      const st_=r.st;const skip=r.d===0;
      h+=`<section class="step" ${skip?'data-skip="1"':''}>
        <h4>${skip?'':`<span class="t">${hm(r.start)} to ${hm(r.end)}</span>`}${esc(st_.n)}${skip?' <span class="pill">Skipped in '+MODES[S.mode]+'</span>':`<span class="pill">${r.d} min</span>`}${st_.moment?' <span class="pill moment">Moment</span>':''}</h4>`;
      if(!skip){
        if(st_.say&&st_.say.length){h+=`<span class="lbl">Say</span><div class="say">${st_.say.map(x=>`<p>${esc(x.replace("{TOTAL}",TOTALS[S.mode]))}</p>`).join("")}</div>`}
        if(st_.do&&st_.do.length){h+=`<span class="lbl">Do</span><ul class="tight">${st_.do.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`}
        if(typeof st_.moment==="string"){h+=`<div class="moment-box"><b>Mic drop.</b> ${esc(st_.moment)}</div>`}
        if(st_.watch&&st_.watch.length){h+=`<span class="lbl">Watch for</span><ul class="tight watch">${st_.watch.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`}
        if(st_.ans){h+=`<div class="actions"><button class="btn small" type="button" data-goans="${st_.ans}">Open answers</button></div>`}
      }
      h+=`</section>`;
    });
    h+=`<div class="actions"><button class="btn small primary" type="button" data-startseg="${i}">Start this segment now</button></div>
      </div></article>`;
  });
  h+=`<details class="accbox"><summary>Running late or early?</summary><div class="in"><div class="grid2"><div class="card"><h3>If you are running late</h3><p class="sub">Cut in this order. Times are minutes saved in ${MODES[S.mode]} mode.</p><ul class="tight" id="cutList">${CUTS.map(c=>{const m=c.mins[S.mode];return `<li data-cut="${c.seg}" ${m===0?'style="opacity:.45"':''}>${esc(c.label)} <span class="pill">${m===0?"not in this mode":"saves "+m+" min"}</span></li>`}).join("")}</ul></div>
   <div class="card"><h3>If you are running early</h3><p class="sub">Add one of these. Never add to a segment that has a mic-drop moment.</p><ul class="tight">${EXTRAS.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></div></div></details>`;
  el.innerHTML=h;return el;
}
function segState(i){
  if(S.cur<0)return i===0?"next":"later";
  if(i<S.cur)return "done";if(i===S.cur)return "now";return "later";
}

/* ============================================================
   CLOCK
   ============================================================ */
let tick=null,wake=null;
function startClock(){
  if(S.running)return;
  S.running=true;S.base=Date.now()-S.elapsed*1000;
  if(S.cur<0){S.cur=0;S.segStart[0]=0}
  clearInterval(tick);tick=setInterval(()=>{S.elapsed=(Date.now()-S.base)/1000;updateDesk()},500);
  try{if(navigator.wakeLock){navigator.wakeLock.request("screen").then(w=>{wake=w}).catch(()=>{})}}catch(e){}
  $("#startBtn").textContent="Pause";render(true);
}
function pauseClock(){S.running=false;clearInterval(tick);$("#startBtn").textContent="Resume";try{if(wake){wake.release();wake=null}}catch(e){}updateDesk()}
function resetClock(){pauseClock();S.elapsed=0;S.cur=-1;S.segStart=[];$("#startBtn").textContent="Start session";render(true);updateDesk()}
function goSeg(i){
  const P=plan();if(i<0||i>=P.length)return;
  S.cur=i;S.segStart[i]=S.elapsed;
  if(!S.running&&S.elapsed===0){}
  S.open={};render(true);updateDesk();
  const a=document.getElementById("seg-"+P[i].s.id);if(a&&S.tab==="run"){a.scrollIntoView({behavior:"smooth",block:"start"})}
}
function drift(){
  const P=plan();if(S.cur<0||S.cur>=P.length)return 0;
  const p=P[S.cur];const start=S.segStart[S.cur]!==undefined?S.segStart[S.cur]:p.start*60;
  const projEnd=Math.max(S.elapsed,start+p.dur*60);
  return projEnd-p.end*60;
}
function updateDesk(){
  const P=plan();
  $("#clockT").textContent=hms(S.elapsed);
  const cur=S.cur>=0?P[S.cur]:null;
  $("#nowTxt").textContent=cur?cur.s.name:"Not started";
  const nx=S.cur+1<P.length?P[S.cur+1]:null;
  $("#nextTxt").textContent=S.cur<0?P[0].s.name:(nx?nx.s.name:"Session ends");
  const bar=$("#bar");
  const tot=total()*60;
  let pos=bar.querySelector("i");if(!pos){pos=document.createElement("i");bar.appendChild(pos)}
  pos.style.left=Math.min(100,S.elapsed/tot*100)+"%";
  bar.querySelectorAll("button").forEach((b,i)=>b.classList.toggle("cur",i===S.cur));
  const cue=$("#cue");cue.className="cue";
  if(!S.running&&S.elapsed===0){cue.textContent="Press Start session when the doors open. The clock runs from 00:00.";return}
  if(!S.running){cue.textContent="Paused at "+ms(S.elapsed)+". Press Resume.";cue.classList.add("warn");return}
  if(!cur){return}
  const start=S.segStart[S.cur]!==undefined?S.segStart[S.cur]:cur.start*60;
  const left=start+cur.dur*60-S.elapsed;
  const d=drift();
  const dTxt=Math.abs(d)<30?"on time":(d>0?ms(d)+" behind plan":ms(-d)+" ahead of plan");
  if(S.elapsed>=tot+60&&S.cur===P.length-1){cue.classList.add("ok");cue.textContent="Session complete. Thank everyone and hand over to the helpers.";return}
  if(left<0){
    const over=-left;
    cue.classList.add(over>180?"bad":"warn");
    cue.textContent=(over>180?"Over by ":"Over by ")+ms(over)+" on "+cur.s.name+". "+(over>180?"Wrap up now and move on. See the cuts below.":"Start wrapping up.")+" ("+dTxt+")";
  }else if(left<=120){
    cue.classList.add("warn");cue.textContent=ms(left)+" left in "+cur.s.name+". Start the wrap-up line. ("+dTxt+")";
  }else{
    cue.textContent=cur.s.name+": "+ms(left)+" left of "+cur.dur+" min. ("+dTxt+")";
  }
  document.querySelectorAll("#cutList li").forEach(li=>li.style.outline="");
  if(d>=180){
    let need=d/60;const P2=plan();
    CUTS.forEach(c=>{
      const idx=P2.findIndex(p=>p.s.id===c.seg);const m=c.mins[S.mode];
      if(need>0&&m>0&&idx>=S.cur){document.querySelectorAll('#cutList li[data-cut="'+c.seg+'"]').forEach(li=>{if(li.textContent.includes(c.label))li.style.outline="3px solid var(--warn)"});need-=m}
    });
  }
}
function buildBar(){
  const P=plan();const bar=$("#bar");bar.innerHTML="";
  P.forEach((p,i)=>{
    const b=document.createElement("button");b.className=p.s.kind;b.type="button";
    b.style.flex=p.dur+" 1 0";b.title=p.s.name+" "+p.dur+" min";b.setAttribute("aria-label",p.s.name+", "+p.dur+" minutes");
    b.addEventListener("click",()=>{S.tab="run";setTab("run");const a=document.getElementById("seg-"+p.s.id);if(a){S.open[p.s.id]=true;render(false);document.getElementById("seg-"+p.s.id).scrollIntoView({behavior:"smooth",block:"start"})}});
    bar.appendChild(b);
  });
}

function coaster(g,pts){
  let ph=null,pv=0,th=0;const log=[];
  for(const h of pts){
    if(ph===null){ph=h;continue}
    const vs=pv*pv+2*g*(ph-h);
    if(vs<=0)return {stalled:true,at:h,th,log};
    const v=Math.sqrt(vs);th+=Math.abs(v-pv);log.push({h,v});pv=v;ph=h;
  }
  return {stalled:false,th,log,rating:rate(th)};
}
function rate(t){const a=12,b=55;if(t>=a&&t<=b)return Math.round(100-20*Math.abs(t-(a+b)/2)/((b-a)/2));if(t<a)return Math.round(80*t/a);return Math.max(0,Math.round(80-(t-b)*3))}
function face(t){return t>55?"sick face (too intense)":t>30?"amazed face":t>12?"happy face":"neutral face (tame)"}
const PH={"lemon juice":2,"vinegar":2.5,"black coffee":5,"milk":6.5,"baking soda":9,"soap":10,"ammonia":11.5,"bleach":13};
function mixPH(a,b){const h1=10**-a,o1=10**(a-14),h2=10**-b,o2=10**(b-14);const n=((h1-o1)+(h2-o2))/2;return n>0?-Math.log10(n):n<0?14+Math.log10(-n):7}
function verdict(p){return p<3?"strongly acidic":p<6.5?"weakly acidic":p<=7.5?"neutral":p<=11?"weakly alkaline":"strongly alkaline"}
function groverK(N){const th=Math.asin(1/Math.sqrt(N));return Math.max(1,Math.round(Math.PI/4/th-.5))}
function groverP(N,k){const th=Math.asin(1/Math.sqrt(N));return Math.sin((2*k+1)*th)**2}
function shift(w,n){return [...w].map(c=>String.fromCharCode((c.charCodeAt(0)-65+n+26)%26+65)).join("")}

function bindAnswers(root){

  const calc=()=>{
    const r=coaster(+g("cg").value||9.8,[+g("c1").value,+g("c2").value,+g("c3").value,+g("c4").value]);
    g("cout").innerHTML=r.stalled?`Stalled at ${r.at} m. The cart ran out of speed. Ride incomplete.`:`Speeds: ${r.log.map(x=>x.v.toFixed(1)).join(", ")} m/s. Thrill ${r.th.toFixed(1)}. Rating <b>${r.rating} / 100</b>. Face: ${face(r.th)}.`;
  };
  ["cg","c1","c2","c3","c4"].forEach(i=>g(i).addEventListener("input",calc));calc();
  const lc=()=>{
    const n=+g("li").value,st=+g("ls").value,cl=+g("lc").value;const pts=[];let h=90;
    for(let i=0;i<n;i++){pts.push(h);h-=st}
    pts.push(h+cl);
    const r=coaster(9.8,pts);
    g("lout").innerHTML=`Points: ${pts.join(", ")}. `+(r.stalled?`Stalled at ${r.at} m (climb ${cl} is not less than total drop ${n*st}).`:`Thrill ${r.th.toFixed(1)}. Rating <b>${r.rating} / 100</b>.`);
  };
  ["li","ls","lc"].forEach(i=>g(i).addEventListener("input",lc));lc();
  const pc=()=>{const a=PH[g("pa").value],b=PH[g("pb").value];const p=mixPH(a,b);g("pout").innerHTML=`pH <b>${p.toFixed(2)}</b>, ${verdict(p)}. (Simple average would be ${((a+b)/2).toFixed(2)}.)`};
  g("pa").addEventListener("change",pc);g("pb").addEventListener("change",pc);pc();
  const rc=()=>{const n=+g("rn").value,b=+g("rb").value;g("rout").innerHTML=b>0?`Exact cycles: <b>${Math.ceil(n/b)}</b> (${n} / ${b}).`:"Enter a size above zero."};
  g("rn").addEventListener("input",rc);g("rb").addEventListener("input",rc);rc();
  const gc=()=>{const n=Math.max(2,+g("gn").value||2);const k=groverK(n);g("gout").innerHTML=`${n.toLocaleString()} boxes: about <b>${k.toLocaleString()}</b> tuned quantum steps (chance ${(groverP(n,k)*100).toFixed(1)}%). One at a time by hand needs up to ${n.toLocaleString()} looks.`};
  g("gn").addEventListener("input",gc);gc();
  root.querySelectorAll("[data-jump]").forEach(b=>b.addEventListener("click",()=>openAns(b.dataset.jump)));
}

const QA=[
["Careers","Do I need to be good at maths to move into tech?","Not for most roles. Today used counting, comparing and spotting patterns. Testing, business analysis, product, support, delivery, and much of security lean on logic, care and clear writing. Advanced maths matters for a few areas such as quantitative work, data science and quantum research."],
["Careers","Am I too old to start?","No. Many people move at 40, 50 or later. Bank knowledge is valued in tech teams because they build for banks. Be honest that this is a taster and not a guarantee of a job."],
["Careers","Will AI take these jobs?","Nobody knows for certain. AI is changing how code is written, so people who understand the problem and can check the result matter more. Do not promise outcomes either way."],
["Careers","What roles could someone from my area move into?","Examples only. Operations: business analyst, tester, process automation. Compliance and risk: regulatory technology, risk data. Fraud: fraud analytics, security operations. Customer roles: product support, service design, user research. HR: people analytics. Sales: product or technical account roles. Point to the follow-up contact for real options."],
["Careers","How long does it take to become a developer?","It depends on the role and how much time someone has. Months to years is honest. Many tech-adjacent roles need less than full development skills. Suggest a first step, not a timeline."],
["Careers","What should I learn first?","A common route is spreadsheet logic, then SQL for data, then a language such as Python, alongside how software teams work. Say it is one route, not the only one."],
["Careers","Do I need a degree?","Not always. Many roles accept experience, apprenticeships, or certifications. It varies by employer and role."],
["Careers","What does a developer actually do all day?","Mostly reading existing code, fixing problems, testing, and talking to colleagues. Writing new code is a smaller part. Compound Click is the small version of trigger, logic, feedback."],
["Careers","Does the bank offer training or secondments?","Say what you know. If you do not know the current programme, say so and point to the follow-up contact in the Checklists tab. Never guess."],
["Careers","I am worried about my own job. What should I do?","Listen first. Say it is a reasonable worry and that this session is a taster, not advice about their job. Point them to HR or their manager for their own situation, and to the follow-up link for learning options."],
["Tech","Is LoomScript a real programming language?","Yes. It has its own tokenizer, parser and interpreter, written by the session creator. It is a small teaching language and the engine check is a prototype feature. The ideas are the same as in any language."],
["Tech","Is the Real Code tab what actually runs?","Yes. The block code is joined into a text script and that text is what the interpreter reads."],
["Tech","Is Scratch real coding?","Blocks are a real way to learn logic and are widely used for teaching. Professional code is typed as text, but variables, loops, conditions and events are the same ideas."],
["Tech","Is a variable the same as a spreadsheet cell?","Close. A cell holds a value and has an address like B4. A variable holds a value and has a name you choose. Naming it well is the skill."],
["Tech","What is Python, SQL, an API?","Python is a popular general programming language. SQL is the language for asking databases questions. An API is a door one program offers so another program can ask it for things."],
["Tech","What is a compiler or an engine?","A compiler or interpreter reads your text and makes the computer do it. In LoomScript, an engine is a part of the language, such as physics or chemistry. Declaring one tells the language which commands are allowed."],
["Tech","Is this what programmers really do?","Partly. Programmers predict what code will do, run it, look at what happened, and change it. That is the same loop used in the Compound Click practice."],
["Tech","Why did the Vault use a cipher?","Ciphers make loops and conditions matter, and they connect to encryption in banking. The Caesar shift is a simple example of the same idea."],
["Quantum","Is that a real quantum computer?","No. Everything ran on the laptop as a simulation of the maths. Real quantum computers exist, but they are small and error-prone today."],
["Quantum","Are Shor's and Grover's algorithms real?","Yes. Shor's was published in 1994 and Grover's in 1996. The code shown is a plain-English version of the real steps."],
["Quantum","Will quantum break my bank account tomorrow?","No. No machine big enough exists. The concern is about data captured now and opened in the future."],
["Quantum","What is 'harvest now, decrypt later'?","Someone copies encrypted data today, stores it, and waits until a quantum computer can open it. It matters most for data that must stay secret for many years."],
["Quantum","What is the bank doing about it?","Do not speak for the bank. Say that standards bodies such as NIST published the first post-quantum encryption standards in August 2024, and organisations are planning to move. Point to the security team."],
["Quantum","When will quantum computers be a real threat?","Estimates vary widely. The session text says 10 to 20 years for machines that matter. Nobody knows, and the honest answer is uncertainty."],
["Quantum","Why does Grover need 6 steps for 64 boxes?","The steps grow with the square root of the boxes. Roughly 0.785 times the square root of 64, which is about 6. Quadruple the boxes and you only double the steps."],
["Quantum","Does quantum make everything faster?","No. Only certain problems, such as searching and factoring, get a proven speed-up."],
["Quantum","Is 'quantum-safe' the same as quantum?","No. Quantum-safe or post-quantum encryption runs on ordinary computers. It is designed to resist quantum attacks."],
["Session","Do I need an account or to install anything?","No. The four resources run in the browser. Scratch needs the internet but no sign-in."],
["Session","Will my progress be saved?","MindForge saves scores in the browser only. The others do not save. Screenshot the certificate."],
["Session","Can I try this at home?","Yes. Give the follow-up link from the Checklists tab."],
["Session","Can I do it on my phone?","The resources work on a phone. A laptop is better for Scratch."],
["Session","Is my data collected?","The four resources run in the browser and send nothing. Scratch is run by MIT and needs no account for this session."],
["Session","I am lost. Is it me?","No. Everyone is lost sometimes. Use Predict, Run, Investigate, Modify: guess, try, look, change one thing."],
["Session","Can I stop early?","Yes, and say it at the start. Even the smallest working version is real software."]

   ============================================================ */
const GL=[
["Variable","A box with a name that holds a value you can change."],
["Loop","Doing something again. A counted loop runs a set number of times. An until loop keeps going until something is true."],
["Conditional (if)","A question the program asks, then acts on the answer."],
["Event or trigger","Something that happens, like a click, that starts a script."],
["Function","A named set of steps you can run when you need it, like trackPoint()."],
["Algorithm","A set of steps to solve a problem."],
["Linear search","Checking one item at a time, in order."],
["Cipher","A way of scrambling a message. A Caesar cipher shifts each letter along."],
["Interpreter or compiler","The program that reads your code and makes the computer do it."],
["Engine (LoomScript)","A part of the language, such as physics or chemistry, that owns certain commands."],
["Sprite","A character or object on the Scratch stage."],
["Bug and debug","A bug is a mistake in a program. Debugging is finding and fixing it."],
["PRIMM","Predict, Run, Investigate, Modify. A way to learn by guessing first."],
["Grover's algorithm","A quantum method for searching. It needs about the square root of the number of items in steps."],
["Shor's algorithm","A quantum method for finding the factors of a big number. It threatens some encryption."],
["Oracle","A rule that says yes or no to each item without showing how it decided."],
["Post-quantum encryption","Encryption designed to resist quantum computers. It runs on ordinary computers."],
["Harvest now, decrypt later","Copying encrypted data today to open it when quantum computers are big enough."],
["Domain-specific language","A small language built for one job, like a bank's rules language."],
["NIST","The US standards body. It published the first post-quantum encryption standards in August 2024."]
];
function renderGlossary(){
  const el=document.createElement("div");
  el.innerHTML=`<div class="h-row"><div><h2>Glossary</h2><p class="sub">Plain English you can say out loud.</p></div></div>

  const draw=()=>{const q=el.querySelector("#gsearch").value.trim().toLowerCase();el.querySelector("#gbody").innerHTML=GL.filter(x=>!q||(x[0]+" "+x[1]).toLowerCase().includes(q)).map(x=>`<tr><td><b>${esc(x[0])}</b></td><td>${esc(x[1])}</td></tr>`).join("")};

  <p class="sub">Times show start (minutes in brackets). The full analysis and the persona walkthrough are also in the Session Analysis doc: see Files and links.</p>`;
  return el;
}
function renderFiles(){
  const el=document.createElement("div");
  const det=load("res",{});
  el.innerHTML=`<div class="h-row"><div><h2>Files and links</h2><p class="sub">Everything that goes with this Desk.</p></div></div>
  <div class="note"><b>Sharing:</b> these three pages are private until the owner shares them. If a link asks you to sign in or says you do not have access, ask the organiser to share it with you.</div>
  <div class="grid2">
   <div class="card"><h3>Facilitator deck</h3><p>27 slides with speaker notes. Use it on the big screen.</p><a class="btn primary" style="display:inline-block;text-decoration:none" href="${DECK_URL}" target="_blank" rel="noopener">Open the deck</a></div>
   <div class="card"><h3>Session analysis and persona walkthrough</h3><p>The full write-up: timings, persona walkthrough, risks and patch list.</p><a class="btn primary" style="display:inline-block;text-decoration:none" href="${DOC_URL}" target="_blank" rel="noopener">Open the analysis doc</a></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>The four session resources</h3><p class="sub">Paste the web address of each one. They are saved in this browser and become quick links.</p>
   <div class="fields" style="flex-direction:column;align-items:stretch">
   ${[["r1","01 MindForge"],["r2","02 LoomSTEM"],["r3","03 The Vault"],["r4","04 Compound Click"]].map(x=>`<div class="fields" style="align-items:end"><label style="flex:1 1 260px">${x[1]}<input class="field" style="width:100%" id="${x[0]}" type="url" placeholder="https://" value="${esc(det[x[0]]||"")}"></label><a class="btn small" style="text-decoration:none" id="${x[0]}a" target="_blank" rel="noopener" ${det[x[0]]?`href="${esc(det[x[0]])}"`:'aria-disabled="true"'}>Open</a></div>`).join("")}
   </div></div>
  <div class="card" style="margin-top:14px"><h3>Scratch</h3><p>Compound Click uses Scratch. Open <b>scratch.mit.edu</b> and choose Create. No account is needed. Test it on the venue network.</p></div>`;
  ["r1","r2","r3","r4"].forEach(k=>el.querySelector("#"+k).addEventListener("input",e=>{const d=load("res",{});d[k]=e.target.value.trim();store("res",d);const a=el.querySelector("#"+k+"a");if(/^https?:\/\//.test(d[k])){a.href=d[k];a.removeAttribute("aria-disabled")}else{a.removeAttribute("href");a.setAttribute("aria-disabled","true")}}));
  return el;
}

function bindRun(m){
  m.querySelectorAll("[data-toggle]").forEach(b=>b.addEventListener("click",()=>{
    const id=b.dataset.toggle;const card=document.getElementById("seg-"+id);const body=card.querySelector(".segbody");
    body.hidden=!body.hidden;b.setAttribute("aria-expanded",!body.hidden);S.open[id]=!body.hidden;
  }));
  m.querySelectorAll("[data-goans]").forEach(b=>b.addEventListener("click",()=>{const id=b.dataset.goans;setTab("answers");setTimeout(()=>openAns(id),50)}));
  m.querySelectorAll("[data-startseg]").forEach(b=>b.addEventListener("click",()=>{if(!S.running&&S.elapsed===0){startClock()}goSeg(+b.dataset.startseg)}));
  const hs=m.querySelector("#hideStart");hs&&hs.addEventListener("click",()=>{store("hidestart",true);render(true)});
  const ex=m.querySelector("#expandAll"),co=m.querySelector("#collapseAll");
  ex&&ex.addEventListener("click",()=>{SEGS.forEach(s=>S.open[s.id]=true);render(true)});
  co&&co.addEventListener("click",()=>{SEGS.forEach(s=>S.open[s.id]=false);render(true)});
  const cp=m.querySelector("#copySheet");
  cp&&cp.addEventListener("click",()=>{
    const P=plan();let t="Pivot into Tech run sheet ("+MODES[S.mode]+", "+total()+" min"+(S.remote?", remote":"")+")\n";
    P.forEach(p=>{t+="\n"+hm(p.start)+" "+p.s.name+" ("+p.dur+" min)\n";stepRows(p.s,p.start).forEach(r=>{if(r.d>0)t+="   "+hm(r.start)+" "+r.st.n+"\n"})});
    copyText(t);
  });
}
function copyText(t){
  const done=()=>toast("Copied");
  try{navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t))}catch(e){fallbackCopy(t)}
}
function fallbackCopy(t){
  const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
  let ok=false;try{ok=document.execCommand("copy")}catch(e){}
  ta.remove();toast(ok?"Copied":"Copy did not work. Select the text and copy it by hand.");
}
let toastT;
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},2200)}

/* ============================================================
   INIT
   ============================================================ */
function setMode(i){S.mode=i;store("mode",i);$("#modeCtl").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.mode===i));buildBar();render(true);updateDesk()}
(function init(){
  S.mode=load("mode",1);S.remote=!!load("remote",false);
  goToken((location.hash||"").replace("#",""));
  $("#remoteChk").checked=S.remote;
  $("#remoteChk").addEventListener("change",e=>{S.remote=e.target.checked;store("remote",S.remote);buildBar();render(true);updateDesk()});
  $("#modeCtl").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>setMode(+b.dataset.mode)));
  $("#startBtn").addEventListener("click",()=>{if(S.running)pauseClock();else startClock()});
  $("#nextBtn").addEventListener("click",()=>{if(!S.running&&S.elapsed===0)startClock();else goSeg(Math.min(S.cur+1,SEGS.length-1))});
  $("#backBtn").addEventListener("click",()=>{if(S.cur>0)goSeg(S.cur-1)});
  $("#resetBtn").addEventListener("click",()=>{if(S.elapsed>0&&!S.confirmReset){S.confirmReset=true;$("#resetBtn").textContent="Tap again to reset";setTimeout(()=>{S.confirmReset=false;$("#resetBtn").textContent="Reset"},3000);return}S.confirmReset=false;$("#resetBtn").textContent="Reset";resetClock()});
  $("#themeBtn").addEventListener("click",()=>{
    const cur=document.documentElement.getAttribute("data-theme");
    const sysDark=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches;
    const next=(cur||(sysDark?"dark":"light"))==="dark"?"light":"dark";
    document.documentElement.setAttribute("data-theme",next);store("theme",next);
  });
  const th=load("theme",null);if(th)document.documentElement.setAttribute("data-theme",th);
  window.addEventListener("hashchange",()=>{const x=(location.hash||"").replace("#","");if(HASHMAP[x]){const m=HASHMAP[x];if(m[0]!==S.tab||(m[1]&&m[1]!==S.sub[m[0]]))setTab(m[0],m[1])}});
  $("#panicBtn").addEventListener("click",()=>setTab("help","panic"));
  buildTabs();buildBar();setMode(S.mode);updateDesk();
})();
</script>
